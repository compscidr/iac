name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full run catches outside drift (upstream packages, new tool
  # releases) that no PR would trigger.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ansible Lint # Naming the build is important to use it as a status check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      
      - name: Install ansible and ansible-lint
        run: pip install ansible==14.5.0 ansible-lint==26.9.0
      
      - name: Install Ansible dependencies
        run: |
          cd ansible
          ansible-galaxy install -r requirements.yml
      
      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint .

  # Molecule only converges common.yml and dev.yml, so on pull requests it is
  # skipped unless something those playbooks reach changed. The filter is
  # deliberately broad (shared vars/config, every role they reach directly or
  # via include_role/meta deps, external role pins). Push to main, the weekly
  # schedule and manual runs always test, so a gap in this list surfaces on
  # main right after merge rather than never.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      molecule: ${{ steps.filter.outputs.molecule }}
      nas: ${{ steps.filter.outputs.nas }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            molecule:
              - .github/workflows/verify.yml
              - ansible/molecule/**
              - ansible/common.yml
              - ansible/dev.yml
              - ansible/tasks/**
              - ansible/ansible.cfg
              - ansible/inventory.yml
              - ansible/requirements.yml
              - ansible/group_vars/**
              - ansible/host_vars/**
              - ansible/vars/**
              - ansible/roles/academic_gui/**
              - ansible/roles/bootstrap/**
              - ansible/roles/common_cli/**
              - ansible/roles/common_gui/**
              - ansible/roles/dev/**
              - ansible/roles/dev_gui/**
              - ansible/roles/dyndns/**
              - ansible/roles/fnm/**
              - ansible/roles/opencode/**
              - ansible/roles/rustup/**
              - ansible/roles/sshd_alt_port/**
              - ansible/roles/zed/**
            # The nas scenario: nas.yml and every role it reaches.
            nas:
              - .github/workflows/verify.yml
              - ansible/molecule/nas/**
              - ansible/molecule/default/dependency.sh
              - ansible/nas.yml
              - ansible/tasks/**
              - ansible/ansible.cfg
              - ansible/inventory.yml
              - ansible/requirements.yml
              - ansible/group_vars/**
              - ansible/vars/**
              - ansible/roles/backup_nas/**
              - ansible/roles/dyndns/**
              - ansible/roles/factorio_game/**
              - ansible/roles/home_assistant/**
              - ansible/roles/media_server/**
              - ansible/roles/minecraft_bedrock/**
              - ansible/roles/minecraft_game/**
              - ansible/roles/rust_game/**
              - ansible/roles/sshd_alt_port_ugos/**

  # https://github.com/geerlingguy/ansible-role-redis/blob/master/.github/workflows/ci.yml
  deploy-test:
    needs: changes
    # !cancelled() (not always()) so a skipped `changes` job on non-PR events
    # doesn't skip this one, while a superseded run still gets cancelled.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.molecule == 'true') }}
    runs-on: ubuntu-26.04
    name: Molecule Test (${{ matrix.platform }})
    timeout-minutes: 60
    # One runner per molecule platform instead of both containers converging
    # on one runner: roughly halves wall-clock time. fail-fast off so a flake
    # on one release doesn't cancel the other's result.
    # Must match the `platforms:` names in ansible/molecule/default/molecule.yml:
    # a platform added there but not here goes untested in CI.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install 1Password CLI
        # we need op to be on the "deploying device, ie, the GH runner"
        uses: 1password/install-cli-action@v4
      - name: Install and run molecule
        env: # Or as an environment variable
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANSIBLE_CONDITIONALS_ALLOW_BROKEN: "1"
          # community.docker's API read timeout (default 60s). Removing the two
          # fully-converged privileged containers in the final destroy can take
          # longer on a busy runner, failing an otherwise green run.
          DOCKER_TIMEOUT: "300"
        run: |
          pwd
          ls 
          cd ansible
          python -m venv venv
          . venv/bin/activate
          # ansible-core matches what ansible==14.5.0 (the lint job) resolves to, so both
          # jobs test the same core; the driver is molecule-plugins, not the retired
          # molecule-docker 2.1.0 that could not run on ansible-core >= 2.19. Exact pins so
          # Renovate moves them together.
          python -m pip install ansible-core==2.21.4 molecule==26.8.0 'molecule-plugins[docker]==26.7.15' passlib==1.7.4 jmespath==1.0.1
          export ANSIBLE_ALLOW_BROKEN_CONDITIONALS=1
          molecule test --platform-name ${{ matrix.platform }}
  # nas.yml against a UGOS-like container (ansible/molecule/nas, #769). Its
  # own job: it pulls every image the NAS runs (several GB), and needs no
  # 1Password access (the scenario stubs `op`).
  nas-test:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.nas == 'true') }}
    runs-on: ubuntu-26.04
    name: Molecule Test (nas)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The NAS's images come to ~14G; make room by dropping SDKs this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install and run molecule
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          DOCKER_TIMEOUT: "300"
        run: |
          cd ansible
          python -m venv venv
          . venv/bin/activate
          # Same pins as deploy-test above; Renovate moves them together.
          python -m pip install ansible-core==2.21.4 molecule==26.8.0 'molecule-plugins[docker]==26.7.15' passlib==1.7.4 jmespath==1.0.1
          molecule test -s nas
