name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ansible Lint # Naming the build is important to use it as a status check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      
      - name: Install ansible and ansible-lint
        run: pip install ansible==14.5.0 ansible-lint==26.9.0
      
      - name: Install Ansible dependencies
        run: |
          cd ansible
          ansible-galaxy install -r requirements.yml
      
      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint .

  # https://github.com/geerlingguy/ansible-role-redis/blob/master/.github/workflows/ci.yml
  deploy-test:
    runs-on: ubuntu-26.04
    name: Molecule Test (${{ matrix.platform }})
    timeout-minutes: 60
    # One runner per molecule platform instead of both containers converging
    # on one runner: roughly halves wall-clock time. fail-fast off so a flake
    # on one release doesn't cancel the other's result.
    # Must match the `platforms:` names in ansible/molecule/default/molecule.yml:
    # a platform added there but not here goes untested in CI.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install 1Password CLI
        # we need op to be on the "deploying device, ie, the GH runner"
        uses: 1password/install-cli-action@v4
      - name: Install and run molecule
        env: # Or as an environment variable
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANSIBLE_CONDITIONALS_ALLOW_BROKEN: "1"
          # community.docker's API read timeout (default 60s). Removing the two
          # fully-converged privileged containers in the final destroy can take
          # longer on a busy runner, failing an otherwise green run.
          DOCKER_TIMEOUT: "300"
        run: |
          pwd
          ls 
          cd ansible
          python -m venv venv
          . venv/bin/activate
          # ansible-core matches what ansible==14.5.0 (the lint job) resolves to, so both
          # jobs test the same core; the driver is molecule-plugins, not the retired
          # molecule-docker 2.1.0 that could not run on ansible-core >= 2.19. Exact pins so
          # Renovate moves them together.
          python -m pip install ansible-core==2.21.4 molecule==26.8.0 'molecule-plugins[docker]==26.7.15' passlib==1.7.4 jmespath==1.0.1
          export ANSIBLE_ALLOW_BROKEN_CONDITIONALS=1
          molecule test --platform-name ${{ matrix.platform }}