---
- name: Services for www.jasonernst.com
  hosts: www
  vars_files:
    - vars/deb_arch.yml
    - vars/user.yml
  pre_tasks:
    # Tagged 'always' so the connectivity check still runs when the play is
    # invoked with --tags (untagged tasks are otherwise skipped).
    - name: Check Tailscale connectivity
      tags: always
      ansible.builtin.include_tasks: tailscale_check.yml
    # Secrets are fetched ONCE into facts (see projects.yml / #542 for why
    # play vars holding lookups are the wrong place): one `op` call for the
    # nas-rsync password and one for the whole SMTP item.
    - name: Read 1Password items
      tags: always
      ansible.builtin.set_fact:
        # nas rsync-daemon auth for the nightly goblog backup: the dedicated
        # non-admin `svcbackup` UGOS account (`nas-rsync` item, Infrastructure vault),
        # rw on the `storage` share only - same account the rustd_xyz pipeline
        # uses; see roles/backup_nas/README.md.
        jasonernst_com_backup_nas_rsync_password: "{{ lookup('community.general.onepassword', 'nas-rsync', field='password', vault=onepassword_vault,
          account_id=onepassword_account_id) }}"
        # goblog email login: the noreply@jasonernst.com mailu account (created by
        # the mailu role from the same 1Password item). The item must exist before
        # this playbook runs - a onepassword lookup for a missing item is a hard
        # failure, not an empty string.
        jasonernst_com_op_item_smtp: "{{ lookup('community.general.onepassword_raw', 'SMTP_USER - goblog', vault=onepassword_vault,
          account_id=onepassword_account_id) }}"
      no_log: true

    # Match on `id` as well as `label`, like the field lookup does: the SMTP
    # items label username/password as localpart/pw in the 1Password UI.
    - name: Extract fields from the 1Password items
      tags: always
      ansible.builtin.set_fact:
        # Same credential for the mailu backup pipeline (one daemon on the nas).
        mailu_backup_nas_rsync_password: "{{ jasonernst_com_backup_nas_rsync_password }}"
        jasonernst_com_smtp_username: "{{ jasonernst_com_op_item_smtp
          | community.general.json_query(\"fields[?label=='username' || id=='username'].value | [0]\") }}"
        jasonernst_com_smtp_password: "{{ jasonernst_com_op_item_smtp
          | community.general.json_query(\"fields[?label=='password' || id=='password'].value | [0]\") }}"
        jasonernst_com_smtp_from: "{{ jasonernst_com_op_item_smtp
          | community.general.json_query(\"fields[?label=='username' || id=='username'].value | [0]\") }}"
      no_log: true
  vars:
    # Enable nginx fail2ban jails (logs mounted from Docker)
    fail2ban_nginx_enabled: true
    fail2ban_nginx_botscan_enabled: true
    www_redirect_domains:
      - { domain: jasonernst.com, letsencrypt_email: "ernstjason1@gmail.com" }
  roles:
    # www-redirect must run before jasonernst_com so redirect container
    # handles apex domain before app container stops serving it
    - { role: www_redirect, tags: [www-redirect] }
    - { role: jasonernst_com, tags: [jasonernst-com] }
    - { role: fail2ban, tags: [fail2ban] }
    - { role: mailu, tags: [mailu] }
    - { role: uptime_kuma, tags: [uptime-kuma] }
