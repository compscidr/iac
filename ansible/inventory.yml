---
# Local hosts use .local (mDNS) - works on LAN even if Tailscale is down
# Cloud hosts use Tailscale short names (www, projects, hermes)
#
# Hosts in the `lan` group are also on the tailnet: Ansible tries the .local
# name first and falls back to the Tailscale name (the same name without
# .local), so they are reachable away from home too. Keep using the .local
# inventory name in --limit either way. See group_vars/lan.yml.
#
# There is no `mail` host: mail and the website are the same droplet.
# Terraform names it mail.jasonernst.com (for the PTR record) but joins
# the tailnet as `www`, and jasonernst_com.yml runs the stalwart role
# there. A `mail` entry used to sit in the groups below and resolved to
# nothing, so every `hosts: all` play logged an unreachable host.
# Use --limit 'ubuntu-beast*' to match by prefix

ungrouped:
  hosts:
    www:
    nas.local:
    projects:
    hermes:
academic_gui:
  hosts:
    ubuntu-beast.local:
dev:
  hosts:
    jasons-macbook-air.local:
    ubuntu-beast.local:
    ubuntu-silverstone.local:
    ubuntu-cube.local:
    ubuntu-work-laptop.local:
    ubuntu-asus-laptop.local:
    ubuntu-toshiba-laptop.local:
    ubuntu-toshiba-mini-laptop.local:
dev_gui:
  hosts:
    ubuntu-beast.local:
    ubuntu-work-laptop.local:
    ubuntu-asus-laptop.local:
gui:
  hosts:
    jasons-macbook-air.local:
    ubuntu-beast.local:
    ubuntu-work-laptop.local:
    ubuntu-asus-laptop.local:
android_runner:
  hosts:
    ubuntu-silverstone.local:
java_runner:
  hosts:
    ubuntu-silverstone.local:
    ubuntu-cube.local:
    ubuntu-beast.local:
sair:
  hosts:
    ubuntu-cube.local:
    ubuntu-silverstone.local:
# rustd.xyz map render agents (rustd_render_agents.yml). One token per host - see
# the playbook header before adding one. beast participates sometimes: opt it in
# here once its token exists in 1Password as rustd-render-agent-ubuntu-beast.
rustd_render_agents:
  hosts:
    ubuntu-cube.local:
    # ubuntu-beast.local:
tailscale:
  hosts:
    www:
    projects:
    hermes:
# Home machines that are also on the tailnet (group_vars/lan.yml). The asus and
# toshiba laptops and nas.local are not on the tailnet, so they are not here.
lan:
  hosts:
    jasons-macbook-air.local:
    ubuntu-beast.local:
    ubuntu-silverstone.local:
    ubuntu-cube.local:
    ubuntu-work-laptop.local:
linux:
  hosts:
    ubuntu-beast.local:
    ubuntu-silverstone.local:
    ubuntu-cube.local:
    ubuntu-work-laptop.local:
    ubuntu-asus-laptop.local:
    ubuntu-toshiba-laptop.local:
    ubuntu-toshiba-mini-laptop.local:
