---
# Services on ubuntu-cube.local: Rust game servers and the darksearch indexer.
#
# These are not community servers. The build server is for base design; the test
# server (see the bare-metal work) is for exercising rustd.xyz against a real game
# server rather than against the servers people play on.
#
# Usage:
#   ansible-playbook -i inventory.yml cube.yml
- name: Rust game servers on ubuntu-cube
  hosts: ubuntu-cube.local
  vars_files:
    - vars/user.yml
  vars:
    rust_test_server_rcon_password: "{{ lookup('community.general.onepassword', 'rust-rcon-password', field='password', vault=onepassword_vault,
      account_id=onepassword_account_id) }}"
  roles:
    # Same role as nas.local's community servers — every Rust server is defined in one
    # place, and each playbook names the ones it wants. The build server only here: the
    # weekly and monthly servers in that role are the ones people actually play on.
    - role: rust_game
      # A DEDICATED account. The game used to run as jason -- also the manager -- so every
      # permission the collection sets was a no-op and the manager could read the RCON
      # password from the game's /proc entry. See rustd.xyz#419.
      rust_game_runtime_user: rustsvc
      rust_game_servers:
        - build
    - rust_test_server
    # Search backend for darksearch.xyz, built from source. Reachable on :9090
    # over LAN and Tailscale (darksearch on `projects` uses the tailnet name).
    # The index is stored on the NVMe (/var/lib/ipfs_indexer).
    # Stop it without removing: -e ipfs_indexer_state=stopped.
    - { role: ipfs_indexer, tags: [ipfs-indexer] }
