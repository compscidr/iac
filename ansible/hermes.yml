---
# Hermes playbook - AI agent deployment
#
# Targets the `hermes` host (hermes.tail21090.ts.net via MagicDNS).
#
# Prerequisites (personal 1P account ernstjason1@gmail.com):
#   1. Droplet created via Terraform (Tailscale joined via cloud-init).
#   2. Node tagged as agent (one-time, grants ollama/exo access to
#      ubuntu-beast per tailscale-acl.hujson):
#        ssh root@hermes 'tailscale up --advertise-tags=tag:agent --ssh --hostname=hermes'
#   3. Bootstrap run: ansible-playbook -i inventory.yml bootstrap.yml --limit hermes -u root
#   4. `hermes` vault holding the `discord hermes` item:
#            credential            = bot token
#            allowed user ids      = Jason's *numeric* Discord user ID
#                                    (Developer Mode -> right-click ->
#                                    Copy User ID; hermes matches IDs,
#                                    not usernames, and silently ignores
#                                    everyone if this is wrong)
#            allowed channel ids   = #hermes-agent channel ID
#      (Snowflake IDs live in 1P on purpose — keep them out of this
#      public repo.)
#
#   5. `hermes-sa-token` item in the Infrastructure vault, holding the
#      token for kai's own service account (renamed from
#      `openclaw-sa-token` / the `openclaw` SA in 2026-08). The play
#      reads it with whatever ambient credential the operator has and
#      then uses it for every `hermes` vault lookup — so your own
#      identity only ever needs Infrastructure access, not agent-vault
#      access. Without this chain, running from an `op-personal` shell
#      fails with `"hermes" isn't a vault in this account`: an exported
#      OP_SERVICE_ACCOUNT_TOKEN makes `op` authenticate as that service
#      account and ignore --account entirely, and the personal SA has no
#      grant on the agent vault.
#
# Cloud model rungs (all dormant): to activate Anthropic / Kimi /
# OpenAI / xAI / Gemini, add the key to the `hermes` vault, wire a
# lookup for the matching hermes_*_api_key var below, and re-run.
#
# Usage:
#   ansible-playbook -i inventory.yml hermes.yml
#
# Post-run on a fresh install (one-time): seed kai's persona —
# copy/adapt IDENTITY.md + MEMORY.md from ~/.hermes/workspace into
# ~/.hermes/SOUL.md on the host, then send a test message in
# #hermes-agent.

- name: Deploy Hermes Agent
  hosts: hermes
  vars_files:
    - vars/user.yml
  pre_tasks:
    - name: Verify Tailscale reachability to hermes host
      ansible.builtin.include_tasks: tailscale_check.yml
  vars:
    hermes_workspace_repo: "git@github.com:compscidr/kai-workspace.git"
    # Agent vault holding the runtime secrets. Kai's own service account
    # is the only identity granted to it, so the lookups below can't ride
    # on whatever ambient credential the operator happens to have.
    hermes_op_vault: "hermes"
    # Two-step credential chain (the pattern the openclaw role used
    # before it deployed op.env to the host):
    #   1. Ambient credentials — desktop-app integration, or the
    #      personal service account exported by the `op-personal` shell
    #      function — read kai's SA token out of Infrastructure.
    #   2. That token authenticates every `hermes` vault lookup below.
    # Passing `service_account_token` sets OP_SERVICE_ACCOUNT_TOKEN for
    # just that `op` invocation, so the operator's own identity never
    # needs access to the agent vault. `account_id` is deliberately
    # omitted on those lookups: a service account IS its own account
    # context and `op` rejects/ignores --account alongside it.
    hermes_op_service_account_token: >-
      {{ lookup('community.general.onepassword',
                'hermes-sa-token',
                field='credential',
                vault=onepassword_vault,
                account_id=onepassword_account_id) }}
    # Kai's own GitHub identity — deliberately not Jason's fleet-wide
    # key (see host_vars/hermes.yml).
    hermes_ssh_private_key: >-
      {{ lookup('community.general.onepassword',
                'github key',
                field='private key',
                vault=hermes_op_vault,
                service_account_token=hermes_op_service_account_token) }}
    hermes_discord_bot_token: >-
      {{ lookup('community.general.onepassword',
                'discord hermes',
                field='credential',
                vault=hermes_op_vault,
                service_account_token=hermes_op_service_account_token) }}
    hermes_discord_allowed_users: >-
      {{ lookup('community.general.onepassword',
                'discord hermes',
                field='allowed user ids',
                vault=hermes_op_vault,
                service_account_token=hermes_op_service_account_token) }}
    hermes_discord_allowed_channels: >-
      {{ lookup('community.general.onepassword',
                'discord hermes',
                field='allowed channel ids',
                vault=hermes_op_vault,
                service_account_token=hermes_op_service_account_token) }}
    # No @-mention needed in the allowed channel(s) when configured
    # via DISCORD_FREE_RESPONSE_CHANNELS.
    hermes_discord_free_response_channels: "{{ hermes_discord_allowed_channels }}"
  roles:
    - hermes
