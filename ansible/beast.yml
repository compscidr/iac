---
# ubuntu-beast: the GPU workstation's services. Each role is tagged so one can
# be deployed alone (--ask-become-pass: sudo needs a password on the local
# machines, unlike the droplets):
#
#   ansible-playbook -i inventory.yml beast.yml --ask-become-pass
#   ansible-playbook -i inventory.yml beast.yml --ask-become-pass --tags ollama
#
# These used to be three `hosts: all` playbooks (ollama.yml, unmanic.yml,
# nvidia_power_limit.yml) that were only safe with --limit ubuntu-beast.local.
- name: Services for ubuntu-beast
  hosts: ubuntu-beast.local
  vars_files:
    - vars/user.yml
  roles:
    # Caps each GPU's board power via a systemd oneshot that re-applies at
    # boot. See roles/nvidia_power_limit/defaults/main.yml for the values and
    # why they were picked. Safe to re-run; it verifies against the hardware.
    # Try different caps without editing the role:
    #   --tags nvidia-power-limit \
    #   -e '{"nvidia_power_limit_gpus": [{"bus_id": "00000000:05:00.0", "watts": 220}]}'
    - { role: nvidia_power_limit, tags: [nvidia-power-limit] }
    # Ollama with GPU support for local LLM inference. Prerequisites: Docker,
    # NVIDIA drivers, Tailscale. CPU only: -e ollama_gpu_enabled=false.
    # Custom models: -e '{"ollama_models": ["qwen2.5:14b", "codestral:latest"]}'
    # hermes.yml points the hermes role's ollama provider at this server's
    # OpenAI-compatible endpoint (http://ubuntu-beast:11434/v1) over Tailscale.
    - { role: ollama, tags: [ollama] }
    # GPU re-encoding of the NAS media library (see roles/unmanic). After
    # ollama: it relies on the nvidia container runtime that role sets up.
    # Mounts nas.local:/volume1/storage over NFSv3 and transcodes tv/ and
    # movies/ in place. Two instances (free tier = two libraries each): SDR on
    # http://ubuntu-beast.local:8888, HDR on :8889.
    - { role: unmanic, tags: [unmanic] }
