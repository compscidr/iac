---
- name: Services for nas.local
  hosts: nas.local
  vars_files:
    - vars/deb_arch.yml
    - vars/user.yml
    - vars/secrets.yml
  pre_tasks:
    # nas.local itself is reached over LAN mDNS regardless of Tailscale
    # state, but rustd_backup_nas's whole job is putting the nas ON the
    # tailnet (see that role's tasks/main.yml) for the rustd_xyz droplet to
    # reach it - so the controller having a working Tailscale CLI is worth
    # checking up front, same as any other Tailscale-touching play here.
    #
    # Tagged 'always' (matches jasonernst_com.yml) so the connectivity check
    # still runs when the play is invoked with --tags, e.g. the runbook's
    # `--tags rustd-backup` (untagged tasks are otherwise skipped).
    - name: Check Tailscale connectivity
      tags: always
      ansible.builtin.include_tasks: tailscale_check.yml
  roles:
    - media_server
    - home_assistant
    # The two production community servers. The build server shares this role but
    # belongs to ubuntu-cube.local — see cube.yml.
    - role: rust_game
      # The account these servers have always run as. Naming it makes an incidental uid
      # explicit: without this the collection resolves "whoever is uid 1000 here".
      rust_game_runtime_user: steam
      rust_game_servers:
        - weekly
        - monthly
    # - cs2_game
    - dyndns
    - { role: rustd_backup_nas, tags: [rustd, rustd-backup] }
    # Real sshd on :2222 (the UGOS counterpart of sshd_alt_port): the vendor sshd's
    # SFTP is chrooted to the share view, which broke the rustd.xyz panel's file
    # reads for the servers above — see the role README and rustd.xyz#456.
    - { role: sshd_alt_port_ugos, tags: [rustd, ssh-alt] }
