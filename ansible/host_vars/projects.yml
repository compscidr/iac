---
# Host vars for the projects droplet.
#
# It clones two private repos (network-tools, darksearch.xyz), so it
# needs a git identity — but it has no business holding the key that
# opens every workstation. This is a dedicated ed25519 key, added to
# GitHub and authorized on no machine: full repo access, zero lateral
# reach.
#
# The item is a Secure Note holding an ssh-keygen-generated key, NOT a
# 1Password-generated SSH Key item. 1Password hands SSH Key items to
# `op` as PKCS#8 ("-----BEGIN PRIVATE KEY-----"), which OpenSSH refuses
# to load ("invalid format") — `op read` can convert with
# `?ssh-format=openssh`, but the Ansible lookup has no way to ask for
# that. Storing the OpenSSH text directly is what makes the lookup
# below deploy something usable.
deploy_ssh_key_enabled: true
deploy_ssh_private_key: "{{ lookup('community.general.onepassword', 'projects github key', field='private key', vault=onepassword_vault,
  account_id=onepassword_account_id) }}"
