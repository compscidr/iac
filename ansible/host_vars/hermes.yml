---
# Host vars for hermes (the AI agent droplet).
#
# Do NOT deploy Jason's personal SSH key here. The bootstrap role
# defaults `deploy_ssh_key_enabled` (group_vars/all.yml), which drops the private
# key from 1Password into ~/.ssh/id_rsa so a host can clone private
# repos — fine for Jason's own machines, wrong for this one. Hermes
# runs an agent that takes instructions from Discord, and that key is
# authorized across the rest of the fleet: anything that talks the
# agent into running `ssh` would reach every machine that trusts it.
#
# The hermes role instead deploys kai's own ed25519 key (the `github
# key` item in the `hermes` vault), which is authorized only against
# his GitHub account. Same capability for cloning and pushing his
# workspace, none of the lateral reach.
deploy_ssh_key_enabled: false
