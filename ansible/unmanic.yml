---
# Unmanic: GPU re-encoding of the NAS media library (see roles/unmanic).
#
# Runs on ubuntu-beast (RTX 3080 + 5080, nvidia container runtime already set
# up by the ollama role). Mounts nas.local:/volume1/storage over NFSv3 and
# transcodes tv/ and movies/ in place. UI on http://ubuntu-beast.local:8888.
#
# Usage:
#   ansible-playbook -i inventory.yml unmanic.yml --limit ubuntu-beast.local --ask-become-pass

- name: Deploy Unmanic
  hosts: all
  vars_files:
    - vars/user.yml
  roles:
    - unmanic
