---
# Global variables for all hosts

# 1Password settings (personal account)
# Used in all onepassword lookups across roles
onepassword_account_id: "CZG3A4373RA2FC5W5JKFUMYILI"
onepassword_vault: "Infrastructure"

# Bootstrap defaults (servers): no password, NOPASSWD sudo
# Override per group in group_vars/<group>.yml or per host in inventory
# Example for workstations (see group_vars/dev.yml):
#   bootstrap_user_password: "{{ lookup('community.general.onepassword', 'System Account', ...) }}"

# Note: Use --ask-become-pass when running playbooks to provide sudo password
# Automatic 1Password lookup causes too many desktop app prompts

# rustd.xyz nightly DB backup -> nas: the coordinates both ends of the pipeline
# need to agree on. Lives here (not in roles/rustd_xyz/defaults/main.yml)
# because the two ends run in separate playbooks with no shared vars_file:
# the rustd_xyz role (projects.yml, pushes) and the rustd_backup_nas role
# (nas.yml, joins the tailnet + prunes) both read these. Role-local backup
# settings (local keep count, local dir, the rsync-daemon coordinates and
# password file) stay in roles/rustd_xyz/defaults/main.yml since only that
# role needs them.
#
# Transport: the droplet pushes each night's backup directory to the nas'
# BUILT-IN RSYNC DAEMON (UGOS's own service, port 873) - not ssh. Field
# deploy discovery 2026-08-11 killed the original ssh-forced-command design
# outright: the nas' vendor-patched rsync rejects every server-side receive
# regardless of transport, sshd on the appliance has a GLOBAL ForceCommand
# that overrides any per-key `command=` (no ssh-jail is possible at all),
# and the admin account gets full passthrough anyway. The vendor rsync
# daemon sits entirely outside sshd and is the actual supported receive
# path - proven end-to-end, dump landed on the 91TB array over the
# tailnet. Enabling it is a MANUAL UGOS UI prerequisite (module `storage`
# -> /volume1/storage, `auth users = jason:rw`); ansible does not and
# cannot configure it. See roles/rustd_backup_nas/README.md and
# roles/rustd_xyz/templates/rustd-db-backup.sh.j2 for the full story.
rustd_xyz_backup_nas_host: nas # tailnet short name - set via rustd_backup_nas_tailnet_hostname
# (roles/rustd_backup_nas/defaults/main.yml). Deploy discovery 2026-08-11: the nas had
# never joined the tailnet - rustd_backup_nas owns a minimal join (vendor appliance;
# common_cli's full workstation footprint is off-limits there). The join stays even
# though the ssh-based receive design that originally motivated the ACL analysis is
# gone: the rsync daemon is still reached over the tailnet, not the public internet.
# /volume1 is the nas' real (only) data mount - see media_storage_base_path
# in roles/media_server/tasks/main.yml and roles/cs2_game/tasks/main.yml.
# The plan's /volume/backups was a placeholder; there is no /volume share.
# Read directly off disk by the nas-side prune cron (rustd_backup_nas); the
# rsync daemon's own module path (module `storage` + subpath
# `backups/rustd-db`, see roles/rustd_xyz/defaults/main.yml) resolves to
# this same directory.
rustd_xyz_backup_nas_path: /volume1/storage/backups/rustd-db
rustd_xyz_backup_nas_keep: 30

# jasonernst.com nightly goblog backup -> nas: same pipeline shape and same
# rsync daemon as the rustd.xyz backup above, only the subpath differs. Here
# for the same reason: the push side (jasonernst_com role, jasonernst_com.yml)
# and the nas-side prune cron (rustd_backup_nas role, nas.yml) run in
# separate playbooks with no shared vars_file. Only the db snapshots get
# pruned - uploads/ is an additive mirror of the live images/files.
jasonernst_com_backup_nas_path: /volume1/storage/backups/goblog
jasonernst_com_backup_nas_keep: 30

# mailu nightly backup -> nas (issue #479): dkim keys, admin db snapshots,
# mailboxes, mailu.env from the www droplet. Same pipeline shape and daemon
# as the two above; here for the same split-playbook reason. Only the db/
# snapshots get pruned - dkim/, data/, mail/, and mailu.env are additive
# mirrors that must never be aged out.
mailu_backup_nas_path: /volume1/storage/backups/mailu
mailu_backup_nas_keep: 30

# SSH private key deployment.
#
# Off by default: a host only gets a private key if it is explicitly
# granted one. The key this used to hand out unconditionally is Jason's
# personal key, which is authorized across the whole fleet — so every
# droplet that got it could SSH to every workstation. That is a poor
# trade for hosts that only ever needed to clone a git repo, and a
# genuinely bad one for the agent host, whose occupant takes
# instructions from Discord.
#
# Grants live next to the hosts that need them:
#   group_vars/dev.yml     workstations — Jason's own key, on purpose
#   host_vars/projects.yml a GitHub-only key, authorized on no machine
#   host_vars/hermes.yml   off; the hermes role deploys kai's own key
deploy_ssh_key_enabled: false
deploy_ssh_private_key: "{{ lookup('community.general.onepassword', 'Github SSH', field='notesPlain', vault=onepassword_vault,
  account_id=onepassword_account_id) }}"
