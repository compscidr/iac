---
# Dev workstations - password from 1Password
# SSH keys handled by common_cli role, not bootstrap

# Password enables normal sudo (prompts for password)
bootstrap_user_password: "{{ lookup('community.general.onepassword', 'System Account', field='password', vault=onepassword_vault,
  account_id=onepassword_account_id) }}"

# fnm: don't modify shell configs (managed by dotfiles repo)
fnm_configure_shell: false

# rustup: don't modify shell configs (managed by dotfiles repo)
rustup_configure_shell: false

# Workstations get Jason's own key — these are his machines, and the
# fleet-wide authorization is the point here rather than a hazard.
deploy_ssh_key_enabled: true
