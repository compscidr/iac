---
- name: Common tasks for all hosts
  hosts: all
  become: true
  vars_files:
    - vars/deb_arch.yml
    - vars/user.yml
  pre_tasks:
    - name: Check Tailscale connectivity
      ansible.builtin.include_tasks: tailscale_check.yml
      when: inventory_hostname in groups['tailscale'] | default([])
  roles:
    - compscidr.gpg
    - common_cli
    - dyndns
    # Self-gating (Ubuntu + tailscale present): real sshd on :2222 so key-based
    # automation works on hosts where Tailscale SSH owns :22. See the role's README.
    - sshd_alt_port

- name: Common tasks for gui hosts
  hosts: gui
  vars_files:
    - vars/deb_arch.yml
    - vars/user.yml
  roles:
    - common_gui
