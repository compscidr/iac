---
# SAIR deployment playbook
#
# Deploys the SAIR device stack on hosts in the sair group:
#   - ADB server, DeviceSource, Proxy as systemd services
#   - GitHub Runners as Docker containers (host networking)
#
# ubuntu-cube: runs hello-java-android, hello-kotlin-android, icmp runners
# ubuntu-silverstone: runs sair-orchestrator runner (dedicated to avoid
#   port/device conflicts with the live sair stack during integration tests)
#
# The orchestrator runs on the projects droplet (see projects.yml).
#
# Prerequisites:
#   1. Host bootstrapped (bootstrap.yml)
#   2. 1Password items: sair-user-api-key and Wi-Fi (ubuntu-cube), sair-api-key (ubuntu-silverstone),
#      gh-actions-runner-pat (also used for GHCR login; needs read:packages scope).
#      ubuntu-cube also reads sair_bump_api_key from the bump account's Service
#      Integrations vault (BumpApp/bump#6128) through a bump service account with
#      read access to that vault; its token is the bump-op-service-account item here.
#   3. Orchestrator deployed on projects droplet (projects.yml)
#
# Usage:
#   ansible-playbook -i inventory.yml sair.yml

- name: Deploy SAIR on ubuntu-cube
  hosts: ubuntu-cube.local
  vars_files:
    - vars/user.yml
  # Secrets fetched ONCE into facts, not play vars (see projects.yml / #542):
  # two `op` calls, and the PAT is read once for both of its uses.
  pre_tasks:
    - name: Read 1Password items
      tags: always
      ansible.builtin.set_fact:
        sair_api_key: "{{ lookup('community.general.onepassword', 'sair-user-api-key', field='credential', vault=onepassword_vault,
          account_id=onepassword_account_id) }}"
        sair_runner_pat: "{{ lookup('community.general.onepassword', 'gh-actions-runner-pat', field='credential', vault=onepassword_vault,
          account_id=onepassword_account_id) }}"
        sair_op_item_wifi: "{{ lookup('community.general.onepassword_raw', 'Wi-Fi', vault=onepassword_vault, account_id=onepassword_account_id) }}"
        # bump's own sair account locks cube's phones as a guest (compscidr/sair#67).
        # The key lives in bump's 1Password account and is read with a bump service
        # account, whose token is kept in our vault. Desktop-app integration
        # authorizes each account per terminal session, which a lookup run from
        # Ansible can't satisfy for a second account (community.general#10792).
        sair_bump_api_key: "{{ lookup('community.general.onepassword', 'sair_bump_api_key', field='credential', vault='Service Integrations',
          service_account_token=lookup('community.general.onepassword', 'bump-op-service-account', field='credential',
          vault=onepassword_vault, account_id=onepassword_account_id)) }}"
      no_log: true
    # The phones join the same network the host does (see common_cli).
    - name: Bench Wi-Fi for the phones
      tags: always
      ansible.builtin.set_fact:
        sair_wifi_ssid: "{{ sair_op_item_wifi | community.general.json_query(\"fields[?label=='username' || id=='username'].value | [0]\") }}"
        sair_wifi_passphrase: "{{ sair_op_item_wifi | community.general.json_query(\"fields[?label=='password' || id=='password'].value | [0]\") }}"
      no_log: true
    - name: Alias the PAT for the GHCR login
      tags: always
      ansible.builtin.set_fact:
        sair_ghcr_token: "{{ sair_runner_pat }}"
      no_log: true
  vars:
    # A hostname, so acquire also proves DNS works (icmp's instrumented tests
    # need it). Not jasonernst.com: icmp's pingDnsTimeout wants that host cold.
    sair_wifi_ping_host: "google.com"
    sair_guest_api_keys:
      - "{{ sair_bump_api_key }}"
    sair_runners:
      - name: "hello-java-android"
        repo_url: "https://github.com/compscidr/hello-java-android"
        labels: "self-hosted,sair-enabled,linux"
      # jvmToolchain(17) builds: the image's JDK satisfies it, so Gradle needn't download one.
      - name: "hello-kotlin-android"
        repo_url: "https://github.com/compscidr/hello-kotlin-android"
        labels: "self-hosted,sair-enabled,linux"
        image: "compscidr/github-runner-android:jdk17"
      - name: "icmp"
        repo_url: "https://github.com/compscidr/icmp"
        labels: "self-hosted,sair-enabled,linux"
        image: "compscidr/github-runner-android:jdk17"
  roles:
    - sair

- name: Deploy SAIR on ubuntu-silverstone
  hosts: ubuntu-silverstone.local
  vars_files:
    - vars/user.yml
  # Secrets fetched ONCE into facts, not play vars (see projects.yml / #542):
  # two `op` calls, and the PAT is read once for both of its uses.
  pre_tasks:
    - name: Read 1Password items
      tags: always
      ansible.builtin.set_fact:
        sair_api_key: "{{ lookup('community.general.onepassword', 'sair-api-key', field='credential', vault=onepassword_vault,
          account_id=onepassword_account_id) }}"
        sair_runner_pat: "{{ lookup('community.general.onepassword', 'gh-actions-runner-pat', field='credential', vault=onepassword_vault,
          account_id=onepassword_account_id) }}"
      no_log: true
    - name: Alias the PAT for the GHCR login
      tags: always
      ansible.builtin.set_fact:
        sair_ghcr_token: "{{ sair_runner_pat }}"
      no_log: true
  vars:
    # Only ADB server as systemd — CI runs its own proxy/device-source
    sair_adb_only: true
    sair_runners:
      - name: "sair-orchestrator"
        repo_url: "https://github.com/compscidr/sair-orchestrator"
        labels: "self-hosted,sair-enabled,linux"
        # jvmToolchain(21) in the orchestrator build: `latest` follows the newest JDK
        # (27 since Oct 2026) and the dogfood job's setup-java only adds 25, so pin 21.
        image: "compscidr/github-runner-android:jdk21"
  roles:
    - sair
