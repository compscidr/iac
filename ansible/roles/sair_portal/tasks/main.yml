---
# Deploy SAIR portal on the projects droplet
# Landing page + magic-link auth/dashboard at sair.run

- name: Log in to GHCR
  become: true
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ sair_portal_ghcr_user }}"
    password: "{{ sair_portal_ghcr_token }}"
  when: sair_portal_ghcr_token | length > 0
  no_log: true

- name: Create portal data directory
  become: true
  ansible.builtin.file:
    path: "{{ sair_portal_data_dir }}"
    state: directory
    owner: "{{ sair_portal_uid }}"
    group: "{{ sair_portal_gid }}"
    # setgid: the orchestrator opens portal.db as root, and the -shm/-wal files
    # it creates must stay in the portal's group or the portal gets SQLITE_CANTOPEN.
    mode: "2775"

# setgid only covers new files; regroup any sidecars already left as root.
# Group only, no mode, so recursing doesn't stamp 2775 onto the DB files.
- name: Keep existing portal data files in the portal group
  become: true
  ansible.builtin.file:
    path: "{{ sair_portal_data_dir }}"
    group: "{{ sair_portal_gid }}"
    recurse: true

- name: Deploy SAIR portal
  become: true
  no_log: true
  community.docker.docker_container:
    name: sair-portal
    image: "{{ sair_portal_image }}"
    # pull without recreate: the container is replaced only when the image or
    # its config changed, so re-running the play does not restart it.
    pull: true
    restart_policy: unless-stopped
    memory: "{{ sair_portal_memory }}"
    memory_swap: "{{ sair_portal_memory }}" # no swap: Docker refuses to raise memory alone on a running container
    networks:
      - name: nginx-proxy
    mounts:
      - source: "{{ sair_portal_data_dir }}"
        target: /app/data
        type: bind
    env:
      JAVA_TOOL_OPTIONS: "{{ sair_portal_java_opts }}"
      PORTAL_PORT: "{{ sair_portal_port | string }}"
      PORTAL_BASE_URL: "https://www.{{ sair_portal_domain }}"
      PORTAL_DB_PATH: "/app/data/portal.db"
      SMTP_HOST: "{{ sair_portal_smtp_host }}"
      SMTP_PORT: "{{ sair_portal_smtp_port | string }}"
      SMTP_USERNAME: "{{ sair_portal_smtp_username }}"
      SMTP_PASSWORD: "{{ sair_portal_smtp_password }}"
      SMTP_FROM: "{{ sair_portal_smtp_from }}"
      STRIPE_SECRET_KEY: "{{ sair_portal_stripe_secret_key }}"
      STRIPE_WEBHOOK_SECRET: "{{ sair_portal_stripe_webhook_secret }}"
      STRIPE_SOLO_PRICE_ID: "{{ sair_portal_stripe_solo_price_id }}"
      VIRTUAL_HOST: "www.{{ sair_portal_domain }}"
      VIRTUAL_PORT: "{{ sair_portal_port | string }}"
      LETSENCRYPT_HOST: "www.{{ sair_portal_domain }}"
      LETSENCRYPT_EMAIL: "{{ sair_portal_letsencrypt_email }}"
