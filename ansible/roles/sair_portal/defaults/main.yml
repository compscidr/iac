---
# SAIR portal role defaults

# Built from the same sair-orchestrator tag as the orchestrator image.
sair_portal_version: "v0.1.12"
sair_portal_image: "ghcr.io/compscidr/sair-portal:{{ sair_portal_version | regex_replace('^v', '') }}"
sair_portal_port: 8080
sair_portal_domain: "sair.run"
sair_portal_letsencrypt_email: "ernstjason1@gmail.com"
# JVM flags, same reasoning as sair_orchestrator_java_opts: the heap is pinned
# (the JVM default is 25% of whatever RAM it sees) and an OutOfMemoryError ends
# the process so Docker restarts it. On 2026-10-22 a /dashboard/messages query
# blew the heap and the portal sat hung at 1.2 GB RSS with no limit (#919).
# Steady state is ~150 MiB RSS.
sair_portal_java_opts: "-Xmx256m -XX:+ExitOnOutOfMemoryError"
# Container memory limit: heap + metaspace/threads/direct buffers, with room.
sair_portal_memory: "512m"
sair_portal_ghcr_token: ""
sair_portal_ghcr_user: "compscidr"

# SMTP for magic link auth
sair_portal_smtp_host: "mail.sair.run"
sair_portal_smtp_port: 465
sair_portal_smtp_username: ""
sair_portal_smtp_password: ""
sair_portal_smtp_from: ""

# Stripe billing
sair_portal_stripe_secret_key: ""
sair_portal_stripe_webhook_secret: ""
sair_portal_stripe_solo_price_id: ""

# Data directory for SQLite database
sair_portal_data_dir: "/opt/sair-portal/data"
# Must match the UID/GID of the sair user in the portal container Dockerfile
sair_portal_uid: "10001"
sair_portal_gid: "10001"
