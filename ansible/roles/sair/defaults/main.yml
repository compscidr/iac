---
# SAIR role defaults

# sair release to install on the host (proxy, device-source, tools). Pinned so
# a new sair release shows up as a Renovate PR here (preset
# github>compscidr/renovate-config:sair); merging it does not deploy anything,
# re-run sair.yml against the host to upgrade. Empty would mean latest.
sair_version: "v0.1.7"

# When true, only install the ADB server systemd service (not proxy/device-source).
# Use this on hosts where CI runs its own local sair stack.
sair_adb_only: false

# Orchestrator connection
sair_orchestrator_addr: "orchestrator.sair.run:9090"
sair_orchestrator_tls: true

# Ports
sair_adb_server_port: 5038
sair_device_source_port: 8080
sair_proxy_adb_port: 5037
sair_proxy_http_port: 8550

# Secrets (override in playbook via 1Password lookups)
sair_api_key: ""
# Other accounts' sair API keys the proxy accepts beside its own (sair >= the
# release after v0.1.5; older proxies ignore the variable). Listing a key here
# is the owner's consent: that account may lock this host's phones locally,
# under its own billing, without sharing them in the portal. See
# https://github.com/compscidr/sair#guest-tenants
sair_guest_api_keys: []
sair_runner_pat: ""
sair_ghcr_token: ""
sair_ghcr_user: "compscidr"

# Bench Wi-Fi the device source joins phones to on acquire and resets them
# from on release (sair >= v0.1.5). Empty SSID = Wi-Fi not managed on this host.
sair_wifi_ssid: ""
sair_wifi_passphrase: ""
# Host a phone must ping before acquire hands it over; empty = sair's default
# (8.8.8.8, which does not exercise DNS).
sair_wifi_ping_host: ""

# GitHub runner image
sair_runner_image: "compscidr/github-runner-android:latest"

# GitHub runners (list of runner containers). A runner may set `image` to
# override sair_runner_image, e.g. a jdkNN tag matching its Gradle toolchain.
sair_runners:
  - name: "sair"
    repo_url: "https://github.com/compscidr/sair"
    labels: "self-hosted,sair-enabled,linux"
