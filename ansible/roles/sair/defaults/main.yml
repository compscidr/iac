---
# SAIR role defaults

# sair release to install on the host (proxy, device-source, tools). Pinned so
# a new sair release shows up as a Renovate PR here (preset
# github>compscidr/renovate-config:sair); merging it does not deploy anything,
# re-run sair.yml against the host to upgrade. Empty would mean latest.
sair_version: "v0.0.17"

# When true, only install the ADB server systemd service (not proxy/device-source).
# Use this on hosts where CI runs its own local sair stack.
sair_adb_only: false

# Orchestrator connection
sair_orchestrator_addr: "orchestrator.sair.run:9090"
sair_orchestrator_tls: true

# Ports
sair_adb_server_port: 5038
sair_device_source_port: 8080
sair_proxy_adb_port: 5037
sair_proxy_http_port: 8550

# Secrets (override in playbook via 1Password lookups)
sair_api_key: ""
sair_runner_pat: ""
sair_ghcr_token: ""
sair_ghcr_user: "compscidr"

# GitHub runner image
sair_runner_image: "compscidr/github-runner-android:latest"

# GitHub runners (list of runner containers)
sair_runners:
  - name: "sair"
    repo_url: "https://github.com/compscidr/sair"
    labels: "self-hosted,sair-enabled,linux"
