---
- name: Refresh apt cache after removing legacy claude-desktop source
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Restart orca-serve
  ansible.builtin.systemd_service:
    name: orca-serve.service
    scope: user
    state: restarted
    daemon_reload: true

- name: Restart orca-update timer
  become: true
  ansible.builtin.systemd_service:
    name: orca-update.timer
    state: restarted
    daemon_reload: true

- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
