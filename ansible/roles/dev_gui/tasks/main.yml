---
- name: Check if vscode apt repo exists
  tags: vscode
  become: true
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/vscode.sources
  register: dev_gui_vscode_repo_exists

- name: Install vscode apt repo
  tags: vscode
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
    suites: [stable]
    components: [main]
    state: present
    enabled: true
  when: not dev_gui_vscode_repo_exists.stat.exists

# The repo task above only writes the file once, so it never undoes the
# "Enabled: no" that do-release-upgrade adds to third-party sources. The suite
# (stable) is release-independent, so re-enabling is always right.
- name: Re-enable vscode apt repo after an Ubuntu release upgrade
  tags: vscode
  become: true
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/vscode.sources
    regexp: '^Enabled:\s*no\s*$'
    state: absent
  when: dev_gui_vscode_repo_exists.stat.exists

- name: Install vscode
  become: true
  tags: vscode
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - code

- name: Install jetbrains toolbox
  tags: jetbrains
  ansible.builtin.include_role:
    name: webarchitect609.jet_brains_toolbox
    apply:
      become: true

- name: Ensure group wireshark exists
  become: true
  tags: wireshark
  ansible.builtin.group:
    name: wireshark
    state: present

- name: Add user to group wireshark
  become: true
  tags: wireshark
  ansible.builtin.user:
    name: "{{ username }}"
    groups: wireshark
    append: true

- name: Install wireshark
  tags: wireshark
  become: true
  ansible.builtin.apt:
    pkg:
      - wireshark

- name: Postman
  tags: postman
  become: true
  ansible.builtin.unarchive:
    src: https://dl.pstmn.io/download/latest/linux64
    dest: /opt/
    remote_src: true

- name: Postman app shortcut
  tags: postman
  become: true
  ansible.builtin.copy:
    src: files/postman.desktop
    dest: /usr/share/applications/postman.desktop
    mode: "0664"

- name: Dconf-Editor
  tags: dconf
  become: true
  ansible.builtin.apt:
    pkg:
      - dconf-editor

# Ubuntu 24.04's VirtualBox (7.0.16) can't build its kernel module for the 7.x
# HWE kernel: the install leaves virtualbox-dkms half-configured and dpkg
# broken (ubuntu-beast), or "succeeds" with no module (an install made on an
# older kernel). 26.04 ships 7.2, which supports kernel 7. Skip the combination
# that can't work.
- name: Virtualbox
  tags: virtualbox
  become: true
  ansible.builtin.apt:
    pkg:
      - virtualbox
  when: >-
    not (ansible_distribution == 'Ubuntu'
         and ansible_distribution_version is version('26.04', '<')
         and ansible_kernel is version('7.0', '>='))

- name: Lapce
  ansible.builtin.include_role:
    name: compscidr.lapce
    apply:
      tags: lapce
      become: true
  # https://github.com/ansible/ansible/issues/52063#issuecomment-509142583
  tags: lapce

- name: Zed
  ansible.builtin.include_role:
    name: zed
    apply:
      tags: zed
  tags: zed

- name: Spotify
  ansible.builtin.include_role:
    name: compscidr.spotify.spotify
    apply:
      tags: spotify
      become: true
  tags: spotify

# Earlier versions of this role used aaddrick's community claude-desktop apt
# channel, as claude-desktop.sources. Anthropic's official repo (below) uses
# claude-desktop.list, so drop the old file.
- name: Remove legacy aaddrick claude-desktop apt source
  tags: claude-desktop
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/claude-desktop.sources
    state: absent
  notify: Refresh apt cache after removing legacy claude-desktop source

# Claude Desktop: Anthropic's official Linux build (beta), from their apt repo.
# https://code.claude.com/docs/en/desktop-linux
# The claude-desktop package installs the signing key and registers the repo
# itself (same paths as below) and keeps both current, so only bootstrap them
# when they're missing or inactive - a fresh host, or after do-release-upgrade
# commented the list out or renamed it. Rewriting them every run would fight
# the package's own copies.
- name: Check claude-desktop is published for this architecture
  tags: claude-desktop
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      Anthropic publishes claude-desktop for amd64 and arm64 only; this host is
      {{ ansible_facts['architecture'] }}.

- name: Check for the claude-desktop apt key
  tags: claude-desktop
  ansible.builtin.stat:
    path: /usr/share/keyrings/claude-desktop-archive-keyring.asc
  register: dev_gui_claude_desktop_key

# Active = an uncommented deb line for the repo. do-release-upgrade can leave
# the file in place with everything commented out (seen on ubuntu-beast).
- name: Check for an active claude-desktop apt source
  tags: claude-desktop
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: claude-desktop.list
    contains: '^\s*deb\s.*downloads\.claude\.ai/claude-desktop/apt'
  register: dev_gui_claude_desktop_source

# Download to a temp file and install the key only once its primary key is
# exactly the fingerprint from Anthropic's docs.
- name: Bootstrap the claude-desktop apt key
  tags: claude-desktop
  become: true
  when: not dev_gui_claude_desktop_key.stat.exists
  block:
    - name: Install gpg (needed to verify the claude-desktop key)
      ansible.builtin.apt:
        name: gpg
        state: present

    - name: Create temp file for the claude-desktop key
      ansible.builtin.tempfile:
        suffix: .asc
      register: dev_gui_claude_desktop_key_tmp

    - name: Download the claude-desktop key
      ansible.builtin.get_url:
        url: https://downloads.claude.ai/claude-desktop/key.asc
        dest: "{{ dev_gui_claude_desktop_key_tmp.path }}"
        mode: "0644"
        force: true

    - name: Read the claude-desktop key's primary fingerprints
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          gpg --show-keys --with-colons {{ dev_gui_claude_desktop_key_tmp.path }}
          | awk -F: '/^pub/ {p=1; next} p && /^fpr/ {print $10; p=0}'
        executable: /bin/bash
      register: dev_gui_claude_desktop_key_fingerprints
      changed_when: false

    - name: Verify the claude-desktop key fingerprint
      ansible.builtin.assert:
        that: dev_gui_claude_desktop_key_fingerprints.stdout_lines == [dev_gui_claude_desktop_key_fingerprint]
        fail_msg: >-
          Downloaded claude-desktop key has primary fingerprint(s)
          {{ dev_gui_claude_desktop_key_fingerprints.stdout_lines }}, expected only
          {{ dev_gui_claude_desktop_key_fingerprint }}. Not installing it.
        quiet: true

    - name: Install the claude-desktop apt key
      ansible.builtin.copy:
        src: "{{ dev_gui_claude_desktop_key_tmp.path }}"
        dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
        remote_src: true
        mode: "0644"
  always:
    - name: Remove the temp claude-desktop key
      ansible.builtin.file:
        path: "{{ dev_gui_claude_desktop_key_tmp.path }}"
        state: absent
      when: dev_gui_claude_desktop_key_tmp.path is defined

- name: Register Anthropic's claude-desktop apt repository
  tags: claude-desktop
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/claude-desktop.list
    content: |
      deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main
    mode: "0644"
  when: dev_gui_claude_desktop_source.matched == 0

# Present, not latest: new versions arrive with regular apt upgrades.
- name: Install claude-desktop
  tags: claude-desktop
  become: true
  ansible.builtin.apt:
    name: claude-desktop
    state: present
    update_cache: true
