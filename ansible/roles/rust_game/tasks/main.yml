---
- name: Install rust weekly server
  tags: rust-weekly
  ansible.builtin.include_role:
    name: compscidr.rust_gameserver.rust_gameserver
    apply:
      become: true
      tags: rust-weekly
  vars:
    rust_gameserver_identity: "weekly"
    rust_gameserver_name: "California | Weekly | No BP Wipe"
    rust_gameserver_description: "Self hosted in Redwood City CA\\nWipes on Thursdays at 7pm PST\\nWorld Size: {{ rust_gameserver_worldsize }}"
    rust_gameserver_worldsize: 3000
    rust_gameserver_port: 27015
    rust_gameserver_query_port: 27016
    rust_gameserver_rcon_port: 27017
    rust_gameserver_app_port: 27082
    rust_gameserver_rcon_password: "{{ lookup('community.general.onepassword', 'rust-rcon-password', field='password', vault=onepassword_vault,
      account_id=onepassword_account_id) }}"
    rust_gameserver_wipe: "weekly"
    rust_gameserver_manage_wipe_cron: false
    # Defined once in vars/main.yml — see there for why this is group membership
    # rather than sudo, and why the setgid bit is load-bearing.
    rust_gameserver_manager_users: "{{ rust_game_manager_users }}"
    rust_gameserver_identity_dir_mode: "{{ rust_game_identity_dir_mode }}"
    rust_gameserver_overwrite_env: false
    rust_gameserver_seed: 14419
    rust_gameserver_rcon_web_port: 8000
    # Self-hosted banner (collection default points at imgbox, which went down)
    rust_gameserver_banner_url: "https://raw.githubusercontent.com/compscidr/iac/main/ansible/roles/rust_game/files/california-rust.jpg"

- name: Copy oxide plugins
  tags: rust-weekly
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "644"
    owner: "1000"
    group: "1000"
    # oxide.config.json is bootstrap-only: Oxide rewrites it at runtime (adds fields on
    # upgrades), so re-copying would revert its own changes. The plugin stays force-copied.
    force: "{{ item.force | default(true) }}"
  loop:
    - src: files/oxide.config.json
      dest: /etc/rust/server/weekly/oxide/oxide.config.json
      force: false
    - src: files/RustadminOnline.cs
      dest: /etc/rust/server/weekly/oxide/plugins/RustadminOnline.cs
# only if we want a modded server
#    - src: files/Oxide.Ext.RustIO.dll
#      dest: /etc/rust/server/rust-weekly/RustDedicated_Data/Managed/Oxide.Ext.RustIO.dll

- name: Install rust monthly server
