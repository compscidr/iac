---
# Which of the servers defined in tasks/main.yml this host actually runs.
#
# The default is nas.local's pair of production community servers, so nas.yml can go
# on listing the role bare. ubuntu-cube.local overrides it to `[build]` in cube.yml:
# that host runs the build server only, and must never be handed the servers people
# play on.
rust_game_servers:
  - weekly
  - monthly
