---
# Zed editor (#174). Zed has no apt repo; the official install.sh unpacks a
# per-user tarball into ~/.local. This role does the same system-wide from
# the pinned GitHub release so every dev_gui host runs the same build.
# Renovate tracks this pin via a custom manager in renovate.json
# (prereleases are tagged `-pre` and skipped).
zed_version: "1.21.0"
