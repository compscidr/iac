---
# Factorio headless server on nas.local.
#
# Originally seeded from Jason's existing Space Age multiplayer save; the point of
# moving it here was that the game stops depending on his laptop being awake and on
# the right continent. That world was retired on 2026-09-12 (archived under
# factorio_backup_nas_path/retired-2026-09-12) after a public listing let strangers
# build on it, and the server now runs a map the image generated itself: with no zip
# in saves/, the entrypoint creates one from config/map-gen-settings.json with
# whatever mods/mod-list.json enables (the DLC set below).

factorio_game_data_dir: /volume1/@home/jason/factorio
factorio_game_container_name: factorio

# `stable`, not a pinned version, and for the Bedrock reason rather than the Java one:
# Factorio multiplayer requires the client and server to run exactly the same version,
# and Steam updates clients on its own schedule with no way to hold a version back.
# Pinning here guarantees a lockout the week Wube ships a stable release.
#
# Checked before choosing: the tag is currently 2.0.77, the same build the client that
# made the save is running (2.0.77, build 84539, space-age).
factorio_game_image_tag: stable

# The image ships the Space Age DLC data (base, core, elevated-rails, quality,
# space-age) - verified in the image before this role was written, which is what made
# a 2.7GB upload of Jason's own DLC directories unnecessary. The save needs all three
# expansion mods, and multiplayer compares mod checksums, so a partial or stripped
# copy would have desynced every client.
factorio_game_uid: "999"
factorio_game_gid: "10"

# Factorio's game protocol is UDP. Verified free on this host.
factorio_game_port: 34197

# NOT 27015, which is Factorio's own default and is already held by the Rust weekly
# server on this host (TCP and UDP both) - a stock deploy would have collided on day
# one. Published to loopback regardless, like the Minecraft servers: RCON is a full
# admin console and must not follow the game port onto the internet.
factorio_game_rcon_port: 34198

factorio_game_server_name: "California | Space Age"
factorio_game_description: "Self hosted in Redwood City CA"
factorio_game_max_players: 0

# Not listed in the in-game multiplayer browser. It was, for the first eleven days,
# and roughly twenty strangers joined and built on the world; with the whitelist
# below there is nothing a listing can do except invite connection attempts. The
# factorio.com credential is still needed: user verification (next) is checked
# against Wube's auth server whether or not the server publishes itself.
factorio_game_public: false
# Requires players to be authenticated factorio.com accounts. The whitelist is
# matched on those verified names, so this is what makes it worth anything.
factorio_game_require_user_verification: true

# The only accounts allowed to connect. Factorio's --use-server-whitelist flag is
# always passed by the image's entrypoint, but the game only enforces a whitelist
# that has at least one name in it - a missing file or an empty list means anyone
# verified can join (which is how the strangers got in). So this list being NON-EMPTY
# is the whole lockdown, and the role refuses to deploy an empty one. Names are
# factorio.com usernames, case-sensitive.
#
# An in-game `/whitelist add <name>` edits the same file on the NAS and works
# immediately, but the next deploy overwrites it - a durable change goes here.
factorio_game_whitelist:
  - compscidr
  - kayden1234

# Server admins: can run /whitelist, /kick, /ban and console commands
# (allow_commands is admins-only in server-settings.json).
factorio_game_admins:
  - compscidr

# --- Nightly save backup -----------------------------------------------------
factorio_game_backup_script: /volume1/@home/jason/.local/bin/factorio-backup.sh
factorio_game_backup_user: jason
factorio_game_backup_hour: "5"
factorio_game_backup_minute: "0"
