---
# Deploy rustd.xyz panel + postgres on the projects droplet

- name: Log in to GHCR
  become: true
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ rustd_xyz_ghcr_user }}"
    password: "{{ rustd_xyz_ghcr_token }}"
  when: rustd_xyz_ghcr_token | length > 0
  no_log: true

- name: Create rustd base directory
  become: true
  ansible.builtin.file:
    path: "{{ rustd_xyz_base_path }}"
    state: directory
    mode: "0755"

# 0700, not 0755: pg_dump dumps hold RCON credentials (and other rustd.xyz
# secrets), so the directory they land in shouldn't be world-readable.
- name: Create rustd backup directory
  become: true
  ansible.builtin.file:
    path: "{{ rustd_xyz_backup_local_dir }}"
    state: directory
    mode: "0700"

- name: Create rustd-db network
  become: true
  community.docker.docker_network:
    name: rustd-db
    state: present

- name: Create rustd-db data volume
  become: true
  community.docker.docker_volume:
    name: rustd-db-data

# The panel downloads a ~9MB GeoLite2 country database into /app/data and refreshes
# it weekly. Without a volume that download is repeated after every restart; with one
# it survives. A fresh volume inherits /app/data's ownership from the image, which is
# the runtime user (compscidr/rustd.xyz#464) - do NOT mount it anywhere else, /app
# itself is root-owned and the container runs unprivileged.
- name: Create rustd geoip data volume
  become: true
  community.docker.docker_volume:
    name: rustd-geoip-data

- name: Deploy rustd postgres
  become: true
  no_log: true
  community.docker.docker_container:
    name: rustd-db
    image: "{{ rustd_xyz_db_image }}"
    restart_policy: unless-stopped
    networks:
      - name: rustd-db
    volumes:
      - "rustd-db-data:/var/lib/postgresql/data"
    env:
      POSTGRES_DB: "{{ rustd_xyz_db_name }}"
      POSTGRES_USER: "{{ rustd_xyz_db_user }}"
      POSTGRES_PASSWORD: "{{ rustd_xyz_db_password }}"

- name: Deploy rustd.xyz panel
  become: true
  no_log: true
  community.docker.docker_container:
    name: rustd-xyz
    image: "{{ rustd_xyz_image }}"
    pull: true
    recreate: true
    restart_policy: unless-stopped
    networks:
      - name: nginx-proxy
      - name: rustd-db
    volumes:
      - "rustd-geoip-data:/app/data"
    env:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://rustd-db:5432/{{ rustd_xyz_db_name }}"
      QUARKUS_DATASOURCE_USERNAME: "{{ rustd_xyz_db_user }}"
      QUARKUS_DATASOURCE_PASSWORD: "{{ rustd_xyz_db_password }}"
      QUARKUS_MAILER_HOST: "{{ rustd_xyz_smtp_host }}"
      QUARKUS_MAILER_PORT: "{{ rustd_xyz_smtp_port | string }}"
      QUARKUS_MAILER_USERNAME: "{{ rustd_xyz_smtp_username }}"
      QUARKUS_MAILER_PASSWORD: "{{ rustd_xyz_smtp_password }}"
      # Port 465 is Mailu's implicit-TLS submissions port. In Quarkus 3.38.x
      # (io.quarkus:quarkus-mailer) quarkus.mailer.tls maps to
      # Vert.x MailConfig#setSsl(true) - i.e. wrap-in-TLS-from-connect, which
      # is what implicit TLS needs. quarkus.mailer.ssl is the deprecated
      # alias for the same thing; quarkus.mailer.start-tls is a *different*
      # knob (STARTTLS upgrade of a plaintext connection) and is wrong here.
      QUARKUS_MAILER_TLS: "true"
      # Quarkus maps this to rustd.geoip.license-key. Absent, the panel serves no
      # player countries at all and (before rustd.xyz#464) said nothing about why.
      RUSTD_GEOIP_LICENSE_KEY: "{{ rustd_xyz_geoip_license_key }}"
      # Map rendering (compscidr/rustd.xyz#530 spec B). The panel's render queue is
      # always on - there is no RUSTD_MAPGEN_ENABLED any more (rustd.xyz#555): there
      # is no deployment of this panel that wants its maps unrendered. WORKER_LOOP=false
      # says THIS host never generates - it has no steamcmd, and a generation is ~5 GB
      # RSS on a 4 GB droplet. Every render is claimed by an agent on our own hardware
      # instead (rustd_render_agents.yml); with no agent online the queue just waits.
      RUSTD_MAPGEN_WORKER_LOOP: "false"
      VIRTUAL_HOST: "{{ rustd_xyz_domain }}"
      VIRTUAL_PORT: "{{ rustd_xyz_port | string }}"
      LETSENCRYPT_HOST: "{{ rustd_xyz_domain }}"
      LETSENCRYPT_EMAIL: "{{ rustd_xyz_letsencrypt_email }}"

# --- Nightly pg_dump -> nas backup ---------------------------------------
#
# The nas is reached over its built-in rsync daemon (UGOS's vendor-supported
# service, port 873), not ssh. There's no key to generate: auth is the
# daemon's own username/password scheme, so this role just writes the
# password out to a file rsync's --password-file can read. See
# rustd-db-backup.sh.j2's header comment for why the earlier ssh/rrsync/
# forced-command design was abandoned outright.
- name: Write the nas rsync-daemon password file
  become: true
  ansible.builtin.copy:
    dest: "{{ rustd_xyz_backup_rsync_password_file }}"
    content: "{{ rustd_xyz_backup_nas_rsync_password }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy the backup script
  become: true
  ansible.builtin.template:
    src: rustd-db-backup.sh.j2
    dest: "{{ rustd_xyz_base_path }}/rustd-db-backup.sh"
    mode: "0700"

- name: Deploy the backup systemd service
  become: true
  ansible.builtin.template:
    src: rustd-db-backup.service.j2
    dest: /etc/systemd/system/rustd-db-backup.service
    mode: "0644"

- name: Deploy the backup systemd timer
  become: true
  ansible.builtin.template:
    src: rustd-db-backup.timer.j2
    dest: /etc/systemd/system/rustd-db-backup.timer
    mode: "0644"

- name: Enable and start the backup timer
  become: true
  ansible.builtin.systemd_service:
    name: rustd-db-backup.timer
    enabled: true
    state: started
    daemon_reload: true
