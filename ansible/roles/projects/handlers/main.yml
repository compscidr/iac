---
# Reload the running proxy so it re-reads conf.d, without dropping the TLS listeners the
# way a container restart would. Two tasks on one `listen`: the reload is skipped only when
# the proxy is not running (a tag-limited run that never reached the container task), and
# otherwise a failed reload FAILS the play - `nginx -t` first, so a broken conf.d file is
# reported here rather than silently left unapplied while the old config keeps serving.
- name: Look up the nginx-proxy container
  listen: Reload nginx-proxy
  become: true
  community.docker.docker_container_info:
    name: nginx-proxy
  register: projects_nginx_proxy

- name: Test and reload nginx-proxy's config
  listen: Reload nginx-proxy
  become: true
  community.docker.docker_container_exec:
    container: nginx-proxy
    argv:
      - sh
      - -c
      - nginx -t && nginx -s reload
  register: projects_nginx_reload
  failed_when: projects_nginx_reload.rc != 0
  changed_when: true
  when: projects_nginx_proxy.exists and projects_nginx_proxy.container.State.Running

# darksearch's default.conf is bind-mounted as a single file. git replaces the file on update,
# and a single-file mount keeps serving the old one (even across `nginx -s reload`) until the
# container restarts. Compose won't restart web since its own config didn't change, so without
# this nginx changes (rate limits, real client IP) would silently never apply.
- name: Restart darksearch web
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ projects_base_path }}/darksearch"
    files:
      - docker-compose.yml
    services:
      - web
      - admin # admin.conf is a single-file bind mount too
    state: restarted
  environment:
    LETSENCRYPT_EMAIL: "{{ projects_letsencrypt_email }}"

# Same single-file default.conf mount as darksearch (see "Restart darksearch web").
- name: Restart network-tools web
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ projects_base_path }}/network-tools"
    files:
      - docker-compose.yml
    services:
      - web
    state: restarted
  environment:
    LETSENCRYPT_EMAIL: "{{ projects_letsencrypt_email }}"
