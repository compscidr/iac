# Request body limit for every vhost behind nginx-proxy. nginx's default is 1m, and
# nginx-proxy's generated default.conf does not raise it - so until 2026-08-27 any upload
# over 1 MB got a 413 from nginx before reaching the app. The first thing to hit that was
# rustd.xyz's render agents (compscidr/rustd.xyz#530): a finished map is a PNG of about a
# megabyte, posted back as base64 JSON, and every render was rejected and retried until
# it failed. http-level, so it applies to all servers unless one overrides it.
client_max_body_size 64m;
