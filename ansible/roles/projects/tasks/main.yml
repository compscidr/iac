---
# Projects role - deploys toy projects to consolidated droplet
# - ping4.network, ping6.network, dumpers.xyz (network-tools repo)
# - darksearch.xyz (darksearch repo)
# - goblog.live (goblog project site)

# Nginx reverse proxy + LetsEncrypt for SSL
- name: Create nginx config directory
  tags: nginx
  become: true
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "755"

- name: Create nginx log directory for fail2ban
  tags: nginx
  become: true
  ansible.builtin.file:
    path: /var/log/nginx
    state: directory
    mode: "755"
    owner: root
    group: root

- name: Create empty nginx log files (fail2ban requires them to exist)
  tags: nginx
  become: true
  ansible.builtin.file:
    path: "/var/log/nginx/{{ item }}"
    state: touch
    mode: "644"
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve
  loop:
    - access.log
    - error.log

- name: Deploy nginx logging config (enable file logging for fail2ban)
  tags: nginx
  become: true
  ansible.builtin.copy:
    src: nginx-logging.conf
    dest: /etc/nginx/conf.d/logging.conf
    owner: root
    group: root
    mode: "644"
  notify: Reload nginx-proxy

# nginx only re-reads conf.d on a reload, and nginx-proxy's docker-gen reloads it only when
# the config it GENERATES changes - a new or edited file here needs the handler.
- name: Deploy nginx request body limit (render-agent uploads are ~1 MB, nginx's default 1m)
  tags: nginx
  become: true
  ansible.builtin.template:
    src: nginx-client-max-body-size.conf.j2
    dest: /etc/nginx/conf.d/client-max-body-size.conf
    owner: root
    group: root
    mode: "644"
  notify: Reload nginx-proxy

- name: Deploy nginx gzip (off in the base image; nginx-proxy only sets gzip_types)
  tags: nginx
  become: true
  ansible.builtin.copy:
    src: nginx-gzip.conf
    dest: /etc/nginx/conf.d/gzip.conf
    owner: root
    group: root
    mode: "644"
  notify: Reload nginx-proxy

- name: Create nginx-proxy network
  tags: [nginx, network]
  become: true
  community.docker.docker_network:
    name: nginx-proxy
    # Docker only publishes container ports on [::] when the network is IPv6-enabled;
    # without this every site behind the proxy is IPv4-only despite its AAAA record (#591).
    # Docker >= 27 allocates a ULA /64 itself, so no subnet is pinned here.
    enable_ipv6: true
    state: present

- name: Deploy Nginx Reverse Proxy
  tags: nginx
  become: true
  community.docker.docker_container:
    name: nginx-proxy
    image: jwilder/nginx-proxy
    # "" = bind [::] as well as 0.0.0.0; the module's default host IP is
    # 0.0.0.0 only, which left every site unreachable over IPv6 (#591)
    default_host_ip: ""
    published_ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/conf.d:/etc/nginx/conf.d
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - nginx-certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - name: nginx-proxy
    restart_policy: unless-stopped
    memory: "{{ projects_nginx_proxy_memory }}"
    env:
      ENABLE_IPV6: "true" # nginx must also listen on [::] inside the container

- name: Deploy LetsEncrypt companion
  tags: letsencrypt
  become: true
  community.docker.docker_container:
    name: letsencrypt
    image: jrcs/letsencrypt-nginx-proxy-companion
    volumes:
      - nginx-certs:/etc/nginx/certs:rw
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env:
      NGINX_PROXY_CONTAINER: "nginx-proxy"
    networks:
      - name: nginx-proxy
    restart_policy: unless-stopped
    memory: "{{ projects_letsencrypt_memory }}"

# Create projects directory
- name: Create projects base directory
  tags: projects
  become: true
  ansible.builtin.file:
    path: "{{ projects_base_path }}"
    state: directory
    mode: "755"
    owner: "{{ projects_git_user }}"
    group: "{{ projects_git_user }}"

# Clone and deploy network-tools (ping4, ping6, dumpers)
- name: Clone network-tools repo
  tags: [projects, network-tools]
  become: true
  become_user: "{{ projects_git_user }}"
  ansible.builtin.git:
    repo: git@github.com:compscidr/network-tools.git
    dest: "{{ projects_base_path }}/network-tools"
    version: main
    accept_hostkey: true
  # default.conf is a single-file bind mount; see the handler
  notify: Restart network-tools web

- name: Deploy network-tools stack
  tags: [projects, network-tools]
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ projects_base_path }}/network-tools"
    files:
      - docker-compose.yml # Exclude override file (sets external: false for local dev)
    state: present
    pull: always
    build: always # php-fpm image is built from the repo's Dockerfile; default only builds when missing
  environment:
    # VIRTUAL_HOST and LETSENCRYPT_HOST are now hardcoded in docker-compose.yml
    LETSENCRYPT_EMAIL: "{{ projects_letsencrypt_email }}"

# Clone and deploy darksearch
- name: Clone darksearch repo
  tags: [projects, darksearch]
  become: true
  become_user: "{{ projects_git_user }}"
  ansible.builtin.git:
    repo: git@github.com:compscidr/darksearch.xyz.git
    dest: "{{ projects_base_path }}/darksearch"
    version: main
    accept_hostkey: true
  # default.conf is bind-mounted as a single file, which keeps pointing at the old file after
  # git replaces it; only a container restart picks up nginx changes. See the handler.
  notify: Restart darksearch web

# The admin area's bearer token for the indexer's /admin endpoints. In .env (not the task
# environment) so any `docker compose up` in the directory keeps it, not just Ansible's.
- name: Write darksearch .env
  tags: [projects, darksearch]
  become: true
  no_log: true
  ansible.builtin.copy:
    dest: "{{ projects_base_path }}/darksearch/.env"
    content: |
      INDEXER_ADMIN_TOKEN={{ lookup('community.general.onepassword', 'DarkSearch Indexer Admin Token', field='password', vault='Infrastructure',
         account_id=onepassword_account_id) }}
    owner: root
    group: root
    mode: "0600"

- name: Deploy darksearch stack
  tags: [projects, darksearch]
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ projects_base_path }}/darksearch"
    files:
      - docker-compose.yml # Exclude override file (sets external: false for local dev)
    state: present
    pull: always
  environment:
    # VIRTUAL_HOST and LETSENCRYPT_HOST are now hardcoded in docker-compose.yml
    LETSENCRYPT_EMAIL: "{{ projects_letsencrypt_email }}"

# The darksearch admin area is tailnet only: the stack publishes it on 127.0.0.1:8081 and
# `tailscale serve` exposes it as https://projects.<tailnet>.ts.net/ with the node's cert, adding
# the Tailscale-User-Login header the admin pages require. Persistent, so re-runs are no-ops.
- name: Serve the darksearch admin on the tailnet
  tags: [projects, darksearch, tailscale]
  become: true
  ansible.builtin.command:
    cmd: tailscale serve --bg --https=443 http://127.0.0.1:8081
  register: projects_darksearch_tailscale_serve
  changed_when: "'Available within your tailnet' in (projects_darksearch_tailscale_serve.stdout | default(''))"

# ============================================================================
# goblog.live - goblog project site
# ============================================================================
- name: Create goblog.live directories
  tags: [projects, goblog-live]
  become: true
  ansible.builtin.file:
    path: "/opt/goblog-live/{{ item }}"
    state: directory
    mode: "755"
    owner: root
    group: root
  loop:
    - ""
    - uploads
    - plugins-dynamic
    - plugins-wasm
    - themes-installed

- name: Create goblog.live database file if not exists
  tags: [projects, goblog-live]
  become: true
  ansible.builtin.file:
    path: /opt/goblog-live/database.db
    state: touch
    mode: "644"
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve

# One `op` call for the whole OAuth item, split below, instead of one per field (#542).
- name: Read the github_auth_goblog_live item from 1Password
  tags: [projects, goblog-live]
  ansible.builtin.set_fact:
    projects_op_item_github_auth: "{{ lookup('community.general.onepassword_raw', 'github_auth_goblog_live', vault='www.jasonernst.com',
      account_id=onepassword_account_id) }}"
  no_log: true

- name: Copy goblog.live .env
  tags: [projects, goblog-live]
  become: true
  ansible.builtin.copy:
    content: |
      database=sqlite
      sqlite_db=../database.db
      client_id={{ projects_op_item_github_auth | community.general.json_query("fields[?label=='username' || id=='username'].value | [0]") }}
      client_secret={{ projects_op_item_github_auth | community.general.json_query("fields[?label=='credential' || id=='credential'].value | [0]") }}
      admin_login={{ goblog_admin_login }}
      admin_github_id={{ goblog_admin_github_id }}
      ENABLE_DYNAMIC_PLUGINS=true
    dest: /opt/goblog-live/.env
    mode: "644"
    owner: root
    group: root

- name: Clone goblog.live site theme
  tags: [projects, goblog-live]
  become: true
  ansible.builtin.git:
    repo: https://github.com/goblogplatform/goblog-site-theme.git
    dest: /opt/goblog-live/site-theme
    version: main
    force: true
  register: projects_goblog_live_site_theme

# goblog parses theme templates at startup, so a theme pull alone needs a
# restart; the container is otherwise unchanged and docker_container would
# leave it running the old templates.
- name: Deploy goblog.live
  tags: [projects, goblog-live]
  become: true
  community.docker.docker_container:
    name: goblog.live
    image: compscidr/goblog:v0.16.0
    restart: "{{ projects_goblog_live_site_theme.changed | default(false) }}"
    volumes:
      - /opt/goblog-live/uploads:/go/src/github.com/compscidr/goblog/www/uploads
      - /opt/goblog-live/site-theme:/go/src/github.com/compscidr/goblog/themes/site
      - /opt/goblog-live/plugins-dynamic:/go/src/github.com/compscidr/goblog/plugins/dynamic
      - /opt/goblog-live/plugins-wasm:/go/src/github.com/compscidr/goblog/plugins/wasm
      - /opt/goblog-live/themes-installed:/go/src/github.com/compscidr/goblog/themes/installed
    mounts:
      - source: /opt/goblog-live/database.db
        target: /go/src/github.com/compscidr/database.db
        type: bind
      - source: /opt/goblog-live/.env
        target: /go/src/github.com/compscidr/goblog/.env
        type: bind
    networks:
      - name: nginx-proxy
    restart_policy: unless-stopped
    memory: "{{ projects_goblog_live_memory }}"
    env:
      VIRTUAL_HOST: "www.goblog.live"
      VIRTUAL_PORT: "7000"
      LETSENCRYPT_HOST: "www.goblog.live"
      LETSENCRYPT_EMAIL: "{{ projects_letsencrypt_email }}"
      TRUSTED_PROXIES: "172.16.0.0/12"
