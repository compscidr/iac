---
common_gui_terminal_emulators_ubuntu:
  - kitty # gpu enabled
  - rxvt-unicode # hate this one
  - alacritty # opengl enabled, cross platform, no tabs
  - terminator # kind of like a tmux behavior built in
  - stterm # https://st.suckless.org/
  - foot # wayland native (should probably only install on ubuntu)
  - tilda # uses a weird full screen setup.
  - cool-retro-term
  - terminology
  - sakura # simple, multiple tabs

common_gui_terminal_emulators_macos:
  # Cross-platform (also on Ubuntu)
  - kitty # gpu enabled, cross-platform
  - alacritty # opengl enabled, cross platform, no tabs
  # macOS-specific options
  - iterm2 # popular macOS terminal
  - warp # modern AI-powered terminal

# Ubuntu's default terminal is Ptyxis from 25.10 (GNOME's xdg-terminal-exec
# lists only org.gnome.Ptyxis.desktop, so Ctrl+Alt+T and "Open in Terminal"
# launch it). GNOME Terminal is still installed on upgraded hosts but nags to
# be made the default, so pin Ptyxis there. Ptyxis isn't packaged for 24.04.
common_gui_use_ptyxis: >-
  {{ ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('26.04', '>=') }}

# Dock (GNOME favorite-apps), in order.
common_gui_dock_apps:
  - "{{ 'org.gnome.Ptyxis.desktop' if common_gui_use_ptyxis | bool else 'org.gnome.Terminal.desktop' }}"
  - google-chrome.desktop
  - firefox_firefox.desktop
  - org.gnome.Nautilus.desktop
  - code.desktop
  - snap-store_snap-store.desktop
