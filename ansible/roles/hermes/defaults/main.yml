---
# Hermes role defaults
#
# Hermes Agent (https://hermes-agent.nousresearch.com/, Nous Research,
# MIT). This role: installs hermes via the upstream installer, templates
# ~/.hermes/.env (secrets) and ~/.hermes/config.yaml (settings), clones the
# kai-workspace repo (persona/memory source for the one-time SOUL.md seed),
# and runs `hermes gateway` as a linger-enabled user systemd unit.
#
# Secrets come from the `hermes` 1Password vault (kai's scoped service
# account token can read it; grants are by vault UUID). See ansible/hermes.yml
# for the item/field mapping. No Discord snowflakes in this repo: user
# and channel IDs live in the 1P item.
#
# Model providers: local-only by design (ollama on ubuntu-beast primary,
# exo fallback, both over Tailscale — requires the hermes node to carry
# tag:agent, see terraform/tailscale-acl.hujson). Five dormant cloud
# rungs (Anthropic, Kimi/Moonshot, OpenAI, xAI, Gemini) activate when
# their key var is non-empty: drop the key into the 1P item, wire it in
# hermes.yml, re-run the play. Until then, if beast is off/in Windows
# and exo is stopped, hermes is up but model-less and turns fail —
# accepted per the 2026-08-20 design spec.

hermes_user: "{{ username }}"

# Upstream installer drops the binary here (verify on first deploy; if
# the installer uses a different path, override this var — every task
# and the systemd unit consume it).
hermes_bin: "/home/{{ hermes_user }}/.local/bin/hermes"

# Config/state dir. Hermes owns its state subdirs; ansible owns .env,
# config.yaml, and the workspace clone inside it.
hermes_config_dir: "/home/{{ hermes_user }}/.hermes"

# Persona/memory source repo (kai's). Initial-clone-only: hermes/kai
# may write here at runtime; ansible must never clobber it.
hermes_workspace_repo: ""
hermes_workspace_path: "{{ hermes_config_dir }}/workspace"

# Discord (all from 1P via the playbook; empty = task lines skipped).
# ALLOWED_* is hermes's fail-closed access policy: without at least one
# allowed user hermes ignores everyone.
hermes_discord_bot_token: ""
hermes_discord_allowed_users: ""            # comma-separated user IDs
hermes_discord_allowed_channels: ""         # comma-separated channel IDs
hermes_discord_free_response_channels: ""   # channels needing no @-mention

# Local model providers (OpenAI-compatible /v1 endpoints over Tailscale)
# Thinking level for the local model, via hermes's per-model
# `agent.reasoning_overrides`. qwen3.5-a3b is a hybrid reasoning model,
# and both extremes fail in their own way:
#
#   default (unbounded) — reasoning runs roughly ten times longer than
#     the answer, and on agent turns it consumes the whole turn: hermes
#     reports "Thinking-only response" / "Model returned empty after
#     tool calls" and falls through to the fallback.
#   none — the model emits a tool call AND narrates it in visible text
#     ("Let me fetch the item properly now:"). That chatter accumulates
#     in the transcript and the agent appears to loop, announcing
#     actions instead of completing them.
#
# `low` is the setting that works: measured against the same tool-use
# prompt, none produced a tool call plus 101 characters of narration,
# while low and medium produced a clean call with zero narration and
# only ~290 characters of reasoning — short enough not to run away.
#
# Keyed by model name, so this applies to the local model only; a
# frontier model added later keeps its own default.
#
# NOTE: measured against ollama directly (both the native API and /v1,
# which is the interface hermes uses), qwen3.5-a3b returns an IDENTICAL
# 3771 characters of reasoning at "low", "medium", "high" and unset --
# the graded levels are not honoured for this model. Only "none"
# changes anything, which is consistent with the observation above that
# `none` behaved differently while low and medium looked the same.
# Keep "low" (it is harmless and correct if a future ollama honours
# it), but do not expect it to be shortening anything today.
#
# Per-model values now live in hermes_ollama_catalog below.
# Context management. The local model has a 64K window, and a long
# agent session fills it: a ~25k base prompt plus accumulated tool
# output reached n_tokens=65535 (the hard ceiling) after ~56 tool turns.
# At that point the oldest turns fall out of the window, so the agent
# forgets what it already tried and re-announces the same step forever,
# and generation ends without a finish_reason because there is no room
# left to produce one — which hermes reports as a mid-stream drop.
#
# hermes compresses at a ratio of the window but floors that at 0.75 for
# windows under 512K (~49k here), which leaves little headroom when a
# single tool result can be thousands of tokens. Two adjustments:
#
#   threshold_tokens — absolute trigger, whichever fires first. Set well
#     below the ceiling so compression has room to run: the summariser is
#     itself a model call, and attempted with the window nearly full it
#     can fail, back off for hygiene_failure_cooldown_seconds, and let
#     the context keep growing.
#   tail_mode: lean — retains ~3x fewer tokens after compaction than the
#     legacy verbatim tail, which matters far more on a 64K window.
# THE root cause of the stuck sessions: hermes and ollama disagreed
# about how big the context window is. hermes detected the model's
# NATIVE window and cached it —
#
#   ~/.hermes/context_length_cache.yaml
#   qwen3.5:35b-a3b-64k@http://ubuntu-beast...:11434/v1: 262144
#
# — while the modelfile caps ollama at 65536. Hermes was working from a
# window four times larger than the one it actually had.
#
# Everything followed from that. Compaction triggers on a RATIO of the
# window, so 0.75 of a believed 262144 is ~196K: at 58k of real usage
# hermes saw ~22% and concluded there was room to spare, and never
# compacted. Context then grew until it hit ollama's true 65536 ceiling,
# where generation truncates without a finish_reason — which hermes
# reports as a mid-stream drop, and which reads in chat as the agent
# looping and losing track.
#
# model_overrides wins over the detected catalog value, so declaring the
# real window makes every ratio-based calculation correct. Keep this in
# step with the num_ctx of the ollama modelfile.
#
# Now 128K: ubuntu-beast gained an RTX 3080 next to the 5080, and the
# measured cost of doubling the window is 680 MiB of KV cache (this MoE
# keeps KV on only 10 of 42 layers). The model still loads 100% onto
# GPU at this size — see roles/ollama/defaults for the measurements.
# The 64K ceiling was a VRAM constraint, not a model limit; the base
# supports 262144 natively.
hermes_ollama_provider_id: "ollama-beast"

# Local model catalog. EVERY entry is rendered into model_overrides and
# reasoning_overrides, so all of them are fully configured and ready to
# use; hermes_ollama_model below picks which one is active. Switch
# between them from the hermes dashboard without a redeploy, or change
# hermes_ollama_model and re-run the play to change the default.
#
# One entry per model, holding BOTH its window and its reasoning
# setting, because those two drifting apart is the ae9f514c bug class:
# a context_window that disagrees with the ollama modelfile's num_ctx
# makes every ratio-based compaction calculation wrong.
#
# context_window MUST match the num_ctx of the matching entry in
# roles/ollama/defaults/main.yml (ollama_modelfiles).
hermes_ollama_catalog:
  # Incumbent. 16.7GB of weights at 3.1 bits/weight, 18.1GB resident at
  # 128K, 100% on GPU. Clean across every behavioural test: 6/6 tool
  # use, 0/9 unnecessary tool calls, 0/10 duplicate calls, 8/8 recall.
  # Median 0.7s per agent turn.
  - name: "qwen3.5:35b-a3b-128k"
    context_window: 131072
    reasoning_effort: "low"

  # Alternative. Dense 12B but only 7.6GB of weights, 13.5GB resident
  # at 256K, 100% on GPU -- double the window of the incumbent. Equally
  # clean behaviourally (6/6, 0/9, 0/10, 8/8) and measured FASTER per
  # agent turn (0.3s vs 0.7s median) despite lower raw tok/s, because
  # it emits ~21 tokens per turn against the Qwen model's ~100.
  #
  # reasoning_effort MUST be "none". This is not a preference: with
  # reasoning enabled this model never terminates -- 19,906 characters
  # of thinking against an 8000-token budget, still finish=length, no
  # answer -- and "low"/"medium"/"high" are all identical to unset.
  # Verified over /v1 that "none" yields 0 reasoning characters,
  # finish=stop, and a correct answer.
  - name: "gemma4:12b-256k"
    context_window: 262144
    reasoning_effort: "none"
# Tool output is what actually fills the window. Measured on a stuck
# session: tool messages were 110 of 286 but ~38,020 of ~46,100
# conversation tokens — 83%. The upstream defaults are sized for large
# windows and are far too generous for 64K:
#
#   tool_output.max_bytes 50,000 chars is 12-15K tokens for ONE terminal
#     result — a fifth of the whole window.
#   web.extract_char_limit 15,000 chars per page, and the session held
#     two identical 4,311-token web_extract results.
#
# The duplicates matter as much as the sizes: kai re-fetched pages he
# already had, because a full window had evicted the earlier copy. That
# is why hard stops go on below — repeated non-progressing calls are
# the mechanism that fills the window, not just a symptom of it.
#
# Deliberately NOT relaxed alongside the 128K window. Doubling the
# window and the caps together leaves tool output at the same ~83% of
# context and buys nothing; the win is banking the headroom, not
# spending it. Raise these only if real sessions show tool results
# being truncated in a way that costs the agent information.
hermes_tool_output_max_bytes: 16000
hermes_web_extract_char_limit: 6000
# Upstream ships warnings on but hard stops OFF, so a model that keeps
# re-issuing the same call is nudged and then allowed to continue. On a
# small window that is expensive: each repeat costs full tool output.
hermes_tool_hard_stop_enabled: true
# Scales with the window above. This is an ABSOLUTE trigger, so leaving
# it at the old 40000 would compact at 40K of a 128K window and the
# extra room would never be touched — the doubling would buy nothing.
# Same proportion as before (~61% of the window), keeping the headroom
# that lets the summariser run before the ceiling.
hermes_compression_threshold_tokens: 80000
hermes_compression_tail_mode: "lean"
# Wall-clock budget per conversation run: the agent gets a wrap-up notice
# at 80% elapsed rather than being cut off, so a task going nowhere ends
# before it can fill the window. Empty disables.
hermes_run_budget_seconds: 900
hermes_ollama_base_url: "http://ubuntu-beast.tail21090.ts.net:11434/v1"
hermes_ollama_model: "qwen3.5:35b-a3b-128k"
hermes_exo_base_url: "http://ubuntu-beast.tail21090.ts.net:52415/v1"
# exo model id as reported by its /v1/models when exo is running
hermes_exo_model: "mlx-community/Llama-3.2-3B-Instruct-8bit"

# Dormant cloud provider rungs. Empty key = not rendered into .env or
# config.yaml. Model tags are best-current-guess defaults; check the
# provider's model list when activating a rung.
hermes_anthropic_api_key: ""
hermes_anthropic_model: "claude-sonnet-5"
hermes_kimi_api_key: ""
hermes_kimi_model: "kimi-k3"
hermes_openai_api_key: ""
hermes_openai_model: "gpt-5.6"
hermes_xai_api_key: ""
hermes_xai_model: "grok-4.6"
hermes_gemini_api_key: ""
hermes_gemini_model: "gemini-3.1-pro"

# Kai's own SSH private key (the `github key` item in his vault),
# deployed to ~/.ssh/id_ed25519. Empty default means the task is a
# no-op; see host_vars/hermes.yml for why the bootstrap role's
# fleet-wide key is disabled on this host.
hermes_ssh_private_key: ""

# Web dashboard (`hermes dashboard`) — the equivalent of openclaw's
# Control UI: config, API keys, and sessions in a browser. Served on
# loopback and fronted by Tailscale Serve at
# https://hermes.<tailnet>.ts.net, so it is reachable from the tailnet
# and from nowhere else. 9119 is hermes's own default.
hermes_dashboard_enabled: true
hermes_dashboard_port: 9119
# Bind to the tailnet name rather than loopback. The dashboard rejects
# any request whose Host header doesn't match what it bound to (a DNS
# rebinding guard), so a loopback bind behind Tailscale Serve answers
# every request with "Invalid Host header" — Serve forwards the real
# hostname. Binding the real name also makes hermes require an auth
# provider, which is why the basic_auth credentials below are not
# optional.
hermes_dashboard_host: "hermes.tail21090.ts.net"
# Username/password gate (hermes's bundled dashboard_auth/basic
# plugin). Empty username = plugin no-op, which a non-loopback bind
# refuses to start with. Hash and session secret come from 1Password;
# the plaintext password lives there too, for logging in.
hermes_dashboard_username: ""
hermes_dashboard_password_hash: ""
hermes_dashboard_session_secret: ""

# Kai's own tooling. `gh` and `op` let him work with his GitHub account
# and read his own credentials out of 1Password, rather than needing a
# human to paste secrets into a chat window.
#
# The service-account token is the sensitive part: it opens the whole
# `hermes` vault. That vault holds only kai's own credentials (his
# GitHub, his mail account, moltbook), which is the containment — a
# prompt-injected agent can reach kai's things and nothing of Jason's.
# Keep it that way when adding items.
hermes_agent_cli_enabled: true
hermes_op_token_for_agent: ""
hermes_github_token: ""
hermes_git_user_name: "Kai"
hermes_git_user_email: "kai@jasonernst.com"
