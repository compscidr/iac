---
- name: Restart hermes-gateway
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.systemd_service:
    name: hermes-gateway.service
    scope: user
    state: restarted
    daemon_reload: true

- name: Restart hermes-dashboard
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.systemd_service:
    name: hermes-dashboard.service
    scope: user
    state: restarted
    daemon_reload: true
