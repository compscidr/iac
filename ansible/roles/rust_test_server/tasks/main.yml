---
- name: Install steamcmd prerequisites
  tags: rust-test
  become: true
  ansible.builtin.apt:
    name:
      # steamcmd is a 32-bit binary; these provide its runtime without needing a full
      # i386 architecture on the host.
      - lib32gcc-s1
      - lib32stdc++6
      - ca-certificates
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

# Deliberately the tarball rather than the `steamcmd` apt package. That package is i386-only,
# so installing it means `dpkg --add-architecture i386` — a system-wide change that doubles apt
# metadata and invites i386 library sprawl on a host that otherwise has none, all for one test
# rig. (Multiverse is already enabled on ubuntu-cube; the package still has no candidate purely
# because no foreign architecture is registered.) The tarball is self-contained and needs only
# the 32-bit runtime above.
- name: Create the steamcmd directory
  tags: rust-test
  become: true
  ansible.builtin.file:
    path: "{{ rust_test_server_steamcmd_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ rust_test_server_user }}"
    group: "{{ rust_test_server_user }}"

- name: Download and unpack steamcmd
  tags: rust-test
  become: true
  become_user: "{{ rust_test_server_user }}"
  ansible.builtin.unarchive:
    src: https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
    dest: "{{ rust_test_server_steamcmd_dir }}"
    remote_src: true
    creates: "{{ rust_test_server_steamcmd_dir }}/steamcmd.sh"

# Owned by the panel's SSH user directly, rather than the group-membership dance the
# containerised servers need (compscidr/iac#486). The panel writes here to snapshot,
# rewrite the seed and delete map files; owning the tree outright is the simplest way
# to grant that, and this host runs nothing else that needs the directory.
- name: Create the server directory
  tags: rust-test
  become: true
  ansible.builtin.file:
    path: "{{ rust_test_server_root }}"
    state: directory
    mode: '0755'
    owner: "{{ rust_test_server_user }}"
    group: "{{ rust_test_server_user }}"

# Deliberately NOT guarded with `creates:`. Rust ships updates that break servers —
# on 2026-08-06 one removed BasePlayer.violationLevel and killed a plugin outright —
# so a task that installs once and never updates again is the wrong shape for the
# thing it manages. `app_update` is a no-op when already current, so running it every
# time is cheap; the cost is one steamcmd invocation per play.
- name: Install or update the Rust dedicated server
  tags: rust-test
  become: true
  become_user: "{{ rust_test_server_user }}"
  ansible.builtin.command:
    cmd: >-
      {{ rust_test_server_steamcmd_dir }}/steamcmd.sh
      +force_install_dir {{ rust_test_server_root }}
      +login anonymous
      +app_update 258550 validate
      +quit
  register: rust_test_server_install
  # steamcmd says "already up to date" when it did nothing and "fully installed" when
  # it actually wrote something, so report changed only in the latter case rather than
  # claiming a change on every single run.
  changed_when: "'already up to date' not in rust_test_server_install.stdout"
  failed_when: rust_test_server_install.rc != 0

# RustDedicated aborts on boot without this. Steamworks resolves steamclient.so from
# ~/.steam/sdk64 and, when it is missing, InitGameServer returns false and Rust then
# dereferences the null platform in SteamInventory.LoadItemDefinitions:
#
#   Couldn't initialize Steam Server (InitGameServer(0,30015,30016,3,"2632") returned
#   false - error: Failed to load module '/home/jason/.steam/sdk64/steamclient.so')
#   NullReferenceException at Steamworks.SteamInventory.GetDefinitions ()
#
# The failure is a long way from its cause: map generation runs to completion first, so
# the server looks like it is booting normally for minutes before dying. The container
# image provides this path already, which is why only the bare-metal server needs it.
#
# sdk64 ONLY: RustDedicated is 64-bit and the loader named sdk64. A 32-bit link is what
# 32-bit dedicated servers need and would be cargo cult here.
- name: Create the Steam SDK directory
  tags: rust-test
  become: true
  become_user: "{{ rust_test_server_user }}"
  ansible.builtin.file:
    path: "{{ rust_test_server_home }}/.steam/sdk64"
    state: directory
    mode: '0755'

- name: Link steamclient.so where the Steamworks loader looks for it
  tags: rust-test
  become: true
  become_user: "{{ rust_test_server_user }}"
  ansible.builtin.file:
    src: "{{ rust_test_server_steamcmd_dir }}/linux64/steamclient.so"
    dest: "{{ rust_test_server_home }}/.steam/sdk64/steamclient.so"
    state: link
    # steamcmd unpacks the library on first run, not at unarchive time, so on a first
    # play this link is created before its target exists.
    force: true
    follow: false

# The seed lives in its own file so a wipe can rotate it without rewriting the launch
# script — the same split the containerised servers use, so rustd.xyz's `sed -i` on
# seed.env works identically against both.
- name: Create seed.env (never overwritten — wipes rotate it at runtime)
  tags: rust-test
  become: true
  ansible.builtin.copy:
    content: "RUST_SERVER_SEED={{ rust_test_server_seed }}\n"
    dest: "{{ rust_test_server_root }}/seed.env"
    mode: '0644'
    owner: "{{ rust_test_server_user }}"
    group: "{{ rust_test_server_user }}"
    force: false

- name: Install the launch script
  tags: rust-test
  become: true
  ansible.builtin.template:
    src: start.sh.j2
    dest: "{{ rust_test_server_root }}/start.sh"
    mode: '0755'
    owner: "{{ rust_test_server_user }}"
    group: "{{ rust_test_server_user }}"

- name: Install the systemd unit
  tags: rust-test
  become: true
  ansible.builtin.template:
    src: rust-test.service.j2
    dest: /etc/systemd/system/rust-test.service
    mode: '0644'
    owner: root
    group: root

# Installed but not enabled or started by default — see the comment on
# rust_test_server_service_enabled. Supervising this process is the thing #340 is
# trying to observe the absence of.
- name: Set the service state
  tags: rust-test
  become: true
  ansible.builtin.systemd_service:
    name: rust-test
    enabled: "{{ rust_test_server_service_enabled }}"
    state: "{{ 'started' if rust_test_server_service_enabled else 'stopped' }}"
    daemon_reload: true
