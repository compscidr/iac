---
# Bare-metal Rust server for exercising rustd.xyz.
#
# Deliberately NOT the collection role: compscidr.rust_gameserver deploys a docker
# container and has no native install path, and the entire point of this server is
# to be the non-container case — see compscidr/rustd.xyz#340, which needs to observe
# what the `restart` command does when nothing is supervising the process.
rust_test_server_user: jason
rust_test_server_root: /opt/rust-test
rust_test_server_steamcmd_dir: /opt/steamcmd

# Where the Steamworks loader looks for steamclient.so — it resolves the path from the
# SERVER PROCESS's $HOME, not from the install directory, so this has to track the user
# above rather than rust_test_server_root.
rust_test_server_home: "/home/{{ rust_test_server_user }}"
rust_test_server_identity: test
rust_test_server_name: "rustd.xyz test server"
rust_test_server_description: "Test server for rustd.xyz. Wipes frequently."

# 1000 is the smallest world Rust accepts. Map generation dominates a wipe, and this
# server exists to have wipes run against it repeatedly.
rust_test_server_worldsize: 1000
rust_test_server_maxplayers: 5

rust_test_server_port: 30015
rust_test_server_query_port: 30016
rust_test_server_rcon_port: 30017
rust_test_server_app_port: 30082
rust_test_server_seed: 1337

# Whether the systemd unit is enabled at boot AND started by this role. True means the
# server is supervised: it comes back on its own after an RCON `restart`, like a real
# deployment.
#
# This was false on purpose while compscidr/rustd.xyz#340 needed an UNSUPERVISED server
# to observe -- the question was what happens to one when rustd.xyz restarts it, and the
# answer is that the process exits and stays down. That is now recorded on the issue, so
# the server runs supervised.
#
# Set this back to false to reproduce the unsupervised case across a deploy. For a
# one-off, `systemctl stop rust-test` is enough and needs no config change.
rust_test_server_service_enabled: true
