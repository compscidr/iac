---
# compscidr/dotfiles commit to check out into ~/dotfiles. 9844661 is
# compscidr/dotfiles#12: .gitignore for app runtime state in the stowed
# variety/autostart directories.
common_cli_dotfiles_version: 98446611b370be23fc693dc3b9de14054cf87541

# Dotfile packages to stow on each platform
common_cli_dotfile_packages_ubuntu:
  - autostart # GUI app autostart
  - claude # Claude Code config
  - nano # Text editor
  - tmux # Terminal multiplexer
  - variety # Wallpaper manager
  # bashrc is not stowed: ~/.bashrc is a local file that sources it (tasks/dotfiles.yml)

common_cli_dotfile_packages_macos:
  - claude # Claude Code config
  - nano # Text editor (cross-platform)
  - tmux # Terminal multiplexer (cross-platform)
  # Skip: autostart (Linux GUI), bashrc (use zsh), profile (Ubuntu-specific), variety (Linux GUI)
  # Consider adding: fish/ or zshrc/ directories to your dotfiles repo for shell configs

# Files that apps rewrite: copied from the repo once instead of stowed, so
# the app's own writes don't dirty ~/dotfiles (paths are package/path-in-home).
common_cli_dotfile_seed_files:
  - claude/.claude/settings.json
  - claude/.claude/plugins/installed_plugins.json
  # Variety rewrites its config on upgrades and preference changes (0.9 on
  # Ubuntu 26.04 added keys and renumbered sources on first start).
  - variety/.config/variety/variety.conf

# Packages stowed with --no-folding (per-file links, real directories). Only
# where an app writes lots of its own data into the directory; elsewhere a
# folded directory link is useful: new files (e.g. autostart entries) land in
# the repo, ready to commit and restore on a fresh install. Packages with
# common_cli_dotfile_seed_files are always stowed --no-folding as well (see
# tasks/dotfiles.yml): a folded directory would put the repo copy where the
# seed belongs.
common_cli_dotfile_no_folding_packages:
  - claude

# Links an older version of this role stowed that are no longer stowed; they're
# turned into local copies (keeping what tools appended) if still present.
common_cli_dotfile_legacy_links:
  - profile/.profile

common_cli_prereq_packages_ubuntu:
  - curl
  - gpg-agent
  - ssh
  - git

common_cli_prereq_packages_macos:
  - gnupg

common_cli_tools_ubuntu:
  - avahi-daemon # mostly used for <host>.local zeroconf
  - btop # modern and colorful cli resource monitor
  - byobu # text window manager / multiplexer / devops env
  - docker.io # containers
  - docker-buildx
  - docker-compose-v2 # docker compose
  - fish # friendly interactive shell
  - fzf # command line fuzzy finder
  - git # code repos
  - htop # better top (uses mouse for example)
  - jq # command line JSON processor
  - lm-sensors # suggested installed with htop
  - nano # simple command line editor
  # cli system info: neofetch was dropped from the archive in 26.04 (resolute), and its
  # successor fastfetch is not packaged before 25.04, so pick per release.
  - "{{ 'fastfetch' if ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('26.04', '>=') else 'neofetch' }}"
  - nvme-cli # get temperature / stats on nmves
  - powerline # prompt and statusline utility
  - screen # terminal multiplexer
  - shellcheck # static analysis linter for shell scripts
  - stow # use this to manage dotfiles
  - tmux # terminal multiplexer
  - unzip # zip files
  - wget # curl alternative
  - xclip # cli interface for x selections

common_cli_tools_macos:
  # avahi-daemon - built-in as Bonjour on macOS
  - btop # modern and colorful cli resource monitor
  - byobu # text window manager / multiplexer / devops env
  # curl - built-in on macOS
  - lima # Linux virtual machines (required by colima)
  - colima # Docker daemon for macOS
  - docker # containers (CLI)
  - docker-buildx # docker buildx
  - docker-compose # docker compose
  - fish # friendly interactive shell
  - fzf # command line fuzzy finder
  - git # code repos
  - htop # better top (uses mouse for example)
  - jq # command line JSON processor
  # lm-sensors - Linux-specific, not applicable on macOS
  - nano # simple command line editor
  - neofetch # cli system info
  # nvme-cli - Linux-specific, use smartmontools instead if needed
  - powerline-go # prompt and statusline utility
  - screen # terminal multiplexer
  - shellcheck # static analysis linter for shell scripts
  - stow # use this to manage dotfiles
  - tmux # terminal multiplexer
  # unzip - built-in on macOS
  - wget # curl alternative
  # xclip - X11 specific, use pbcopy/pbpaste (built-in) on macOS

common_cli_network_tools_ubuntu:
  - avahi-utils # avahi-browse
  - arp-scan # for ip <-> mac map search
  - dnsutils # dig
  - ethtool # gets info like link speed
  # isc-dhcp-client removed - Ubuntu 24.04+ uses systemd-networkd built-in DHCP
  - iftop # network top
  - iptables-persistent # boot-time loader for netfilter rules
  - iotop # disk top
  - nbtscan # netbios scanner
  - net-tools # ifconfig, netstat, arp
  - nmap # determine open ports
  - socat # sort of like nc but doesn't hang
  - sqlite3 # good db for integration tests
  - sshfs # ssh mounts
  - sshuttle # forward ssh through tunnel
  - tcpstat # network interface statistics reporting tool
  - traceroute # traceroute
  - fail2ban # https://help.ubuntu.com/community/Fail2ban
  - whois # whois
  - wpasupplicant # WiFi authentication for systemd-networkd

common_cli_network_tools_macos:
  # avahi-utils - Bonjour/mDNS built-in, use dns-sd command
  - arp-scan # for ip <-> mac map search
  # dnsutils (dig) - built-in on macOS
  # ethtool - Linux-specific, not applicable on macOS
  # isc-dhcp-client - built-in on macOS
  - iftop # network top
  # iptables-persistent - macOS uses pf/pfctl, not iptables
  # iotop - not available on macOS
  # - nbtscan                 # netbios scanner - requires macports, not in homebrew
  # net-tools (ifconfig, netstat, arp) - built-in on macOS
  - nmap # determine open ports
  - netcat
  - socat # sort of like nc but doesn't hang
  # sqlite3 - built-in on macOS
  # - macfuse                 # required for sshfs - requires GUI approval, install manually
  # - sshfs                   # ssh mounts (requires macfuse) - requires GUI approval, install manually
  - sshuttle # forward ssh through tunnel
  # tcpstat - not readily available on macOS
  # traceroute - built-in on macOS
  # fail2ban - not commonly used on macOS
  # whois - built-in on macOS
