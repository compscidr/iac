---
# Watchtower configuration
common_cli_watchtower_enabled: true
common_cli_watchtower_schedule: "0 0 4 * * *" # Daily at 4 AM (cron format: second minute hour day month dayOfWeek)
common_cli_watchtower_cleanup: true
common_cli_watchtower_include_stopped: false
common_cli_watchtower_debug: false
common_cli_watchtower_timezone: "America/Los_Angeles"
common_cli_watchtower_monitor_only: false
common_cli_watchtower_notification_url: ""

# Weekly systemd timer that removes Docker images no container uses and that
# are over a week old, plus old build cache (tasks/main.yml). Never touches
# containers or volumes. Set false on a host whose hand-built or pulled-ahead
# images should stay (the timer and units are then removed).
common_cli_docker_image_prune: true

# Whether this role may take over the host's network stack (the "Ubuntu/Debian
# headless" block: systemd-networkd + DHCP + wpa_supplicant, with cloud-init's
# network config and the netplan generator disabled). Meant for the LAN boxes
# and laptops, which get their addresses from the home router over DHCP.
#
# Set to false for cloud instances (group_vars/tailscale.yml). DigitalOcean
# droplets have NO DHCP: cloud-init writes static addresses from the metadata
# ConfigDrive into /etc/netplan/50-cloud-init.yaml - on FIRST boot only. The
# ConfigDrive datasource re-renders network config on boot-new-instance, not
# on a plain reboot ("Event Denied: scopes=['network'] EventType=boot" in
# cloud-init.log), so that file plus the netplan generator are the entire
# boot-time chain and nothing recreates the file if it goes missing. With this
# block applied, the file is deleted and the generator disabled, so the host
# keeps running on its kernel state until the next reboot - then eth0 comes up
# with nothing but a link-local address. That took projects (and
# would have taken www and hermes) fully offline on 2026-08-27; recovery was
# the DigitalOcean recovery console. When false, the role also removes what
# an earlier run left behind (tasks/cloud_network_restore.yml).
common_cli_manage_network: true

# avahi mDNS hardening (tasks/avahi.yml): use-ipv6=no plus a timer that takes
# <host>.local back if avahi ever renames itself to <host>-N.local. Meant for
# the LAN hosts, which can have two links on the home network; off for the
# cloud droplets (group_vars/tailscale.yml), which don't use .local names.
common_cli_manage_avahi: true

# Addresses fail2ban (installed with the network tools) never bans, written to
# /etc/fail2ban/jail.d/ignore-local.conf. The stock Debian sshd jail bans after
# 5 failures in 10 minutes, and one ssh as the wrong user from another box on
# the LAN does that in about a second (ubuntu-beast locked out of
# ubuntu-work-laptop on 2026-10-14). Hosts that also run the fail2ban role
# (the droplets) get their ignoreip from its jail.local, which fail2ban reads
# after jail.d/*.conf, so this list does not apply to them.
common_cli_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.0.0/24 # home LAN
  - 100.64.0.0/10 # Tailscale CGNAT range
  - fd7a:115c:a1e0::/48 # Tailscale IPv6

# Re-run Tailscale's install script when its apt source no longer targets this
# release (left commented out by do-release-upgrade). Off for the droplets
# (group_vars/tailscale.yml): they're managed over the tailnet, and the script
# can restart tailscaled mid-run.
common_cli_repair_tailscale_source: true
