---
# The following php_* vars are the documented interface of the external
# geerlingguy.php role (imported via import_role below) and configure it
# directly, so they intentionally do not carry a dev_ prefix.
php_memory_limit: "128M" # noqa: var-naming[no-role-prefix]
php_max_execution_time: "90" # noqa: var-naming[no-role-prefix]
php_upload_max_filesize: "256M" # noqa: var-naming[no-role-prefix]
php_default_version_debian: "8.3" # noqa: var-naming[no-role-prefix]
php_packages: # noqa: var-naming[no-role-prefix]
  - "php{{ php_default_version_debian }}"
  - "php{{ php_default_version_debian }}-cli"
  - "php{{ php_default_version_debian }}-common"
  - "php{{ php_default_version_debian }}-curl"
  - "php{{ php_default_version_debian }}-dev"
  - "php{{ php_default_version_debian }}-gd"
  - "php{{ php_default_version_debian }}-mbstring"
  - "php{{ php_default_version_debian }}-sqlite3"
  - "php{{ php_default_version_debian }}-xml"
  - "php{{ php_default_version_debian }}-intl"
