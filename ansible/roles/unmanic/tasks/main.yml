---
- name: Install NFS client
  tags: unmanic
  become: true
  ansible.builtin.apt:
    name: nfs-common
    state: present

# nofail + automount: a NAS that is off or still booting must not hang this
# host's boot. The mount is established on first access instead.
# 1M rsize/wsize: beast and the NAS share a 10GbE link; the default block
# size leaves most of it idle.
- name: Mount NAS storage export
  tags: unmanic
  become: true
  ansible.posix.mount:
    src: "{{ unmanic_nas_host }}:{{ unmanic_nas_export }}"
    path: "{{ unmanic_mount }}"
    fstype: nfs
    opts: vers=3,rw,hard,rsize=1048576,wsize=1048576,nofail,_netdev,x-systemd.automount
    state: mounted

- name: Create Unmanic directories
  tags: unmanic
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "755"
    owner: "{{ ansible_user_uid }}"
    group: "{{ ansible_user_gid }}"
  loop: "{{ unmanic_instances | map(attribute='name') | map('regex_replace', '^', '/etc/') | list
    + unmanic_instances | map(attribute='name') | map('regex_replace', '^', '/var/cache/') | list }}"

# The libraries, plugin settings and flows all live under /config, and the
# second instance should start from the first one's rather than be clicked
# through again. One-time seed: copy on first deploy only, then drop the
# copied task queue so the new instance does not start on the other one's
# backlog. Each instance then keeps just its own two libraries (deleted by
# hand in the other's UI).
- name: Seed later instances' config from the first
  tags: unmanic
  become: true
  ansible.builtin.shell:
    cmd: >-
      cp -a /etc/{{ unmanic_instances[0].name }}/. /etc/{{ item.name }}/ &&
      python3 -c "import sqlite3; c=sqlite3.connect('/etc/{{ item.name }}/.unmanic/config/unmanic.db'); c.execute('delete from tasks'); c.commit()"
    creates: /etc/{{ item.name }}/.unmanic
  loop: "{{ unmanic_instances[1:] }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy unmanic
  tags: unmanic
  become: true
  community.docker.docker_container:
    name: "{{ item.name }}"
    image: josh5/unmanic:0.4.1
    pull: true
    published_ports:
      - "{{ item.port }}:8888"
    volumes: >-
      {{ [
        '/etc/' ~ item.name ~ ':/config:rw',
        '/var/cache/' ~ item.name ~ ':/tmp/unmanic:rw',
      ] + item.volumes }}
    env:
      TZ: "{{ unmanic_tz }}"
      PUID: "{{ ansible_user_uid | string }}"
      PGID: "{{ ansible_user_gid | string }}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    device_requests:
      - driver: nvidia
        count: -1
        capabilities: [["gpu"]]
    restart_policy: unless-stopped
    memory: "{{ unmanic_memory }}"
    memory_swap: "{{ unmanic_memory_swap }}"
  loop: "{{ unmanic_instances }}"
  loop_control:
    label: "{{ item.name }}"
