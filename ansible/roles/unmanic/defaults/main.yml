---
# Unmanic: re-encodes the oversized remuxes/Bluray encodes on the NAS down to
# streamable H.264 using the NVIDIA GPUs on this host. The NAS exports
# /volume1/storage over NFSv3 (UGOS: File Service -> NFS, plus the share's NFS
# permission list naming this host); it is mounted here and bound into the
# container as /library/<name>. Encodes happen in the local cache dir and the
# result is written back over NFS once, so the link sees one read + one write
# per file.

unmanic_nas_host: nas.local
unmanic_nas_export: /volume1/storage
unmanic_mount: /mnt/nas/storage
# Unmanic's free tier allows two libraries per instance, and the HDR files
# need their own libraries (different transcode config: GPU tone-map to SDR),
# so there are two instances of the same image on the same GPU. Each binds
# only tv/ and movies/ (not the whole share: downloads/ and the *arr config
# dirs have no business being re-encoded); both see the same files and the
# dynamic-range filter in each library decides which instance acts.
# Config in /etc/<name>, encode cache in /var/cache/<name> on the nvme (a
# remux is 40-80G and two workers can be mid-file at once, so not /tmp).
unmanic_instances:
  - name: unmanic
    port: 8888
    volumes:
      - "{{ unmanic_mount }}/tv:/library/tv:rw"
      - "{{ unmanic_mount }}/movies:/library/movies:rw"
  - name: unmanic-hdr
    port: 8889
    volumes:
      - "{{ unmanic_mount }}/tv:/library/tv-hdr:rw"
      - "{{ unmanic_mount }}/movies:/library/movies-hdr:rw"

unmanic_tz: "America/Los_Angeles"
unmanic_memory: "8g"
unmanic_memory_swap: "8g"
