---
# Mailu mail server deployment (consolidated on www with nginx-proxy)

- name: Create Mailu directory
  become: true
  ansible.builtin.file:
    path: "{{ mailu_install_path }}"
    state: directory
    mode: "755"

- name: Create Mailu data directories
  become: true
  ansible.builtin.file:
    path: "{{ mailu_install_path }}/{{ item }}"
    state: directory
    mode: "755"
  loop:
    - data
    - dkim
    - mail
    - overrides
    - overrides/nginx
    - overrides/dovecot
    - overrides/postfix
    - overrides/rspamd
    - overrides/roundcube
    - redis
    - webmail
    - filter
    - mailqueue

- name: Deploy mailu.env
  become: true
  ansible.builtin.template:
    src: mailu.env.j2
    dest: "{{ mailu_install_path }}/mailu.env"
    mode: "600"
  notify: Restart Mailu

- name: Deploy docker-compose.yml
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mailu_install_path }}/docker-compose.yml"
    mode: "644"
  notify: Restart Mailu

# nginx-proxy stores certs as <domain>.crt/<domain>.key
# Mailu expects cert.pem/key.pem - create symlinks
- name: Create cert.pem symlink for Mailu
  become: true
  ansible.builtin.file:
    src: "{{ mailu_hostname }}.crt"
    dest: /var/lib/docker/volumes/certs/_data/cert.pem
    state: link
    force: true

- name: Create key.pem symlink for Mailu
  become: true
  ansible.builtin.file:
    src: "{{ mailu_hostname }}.key"
    dest: /var/lib/docker/volumes/certs/_data/key.pem
    state: link
    force: true

- name: Start Mailu stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ mailu_install_path }}"
    state: present
    pull: always

- name: Wait for Mailu to be ready
  become: true
  ansible.builtin.wait_for:
    port: 443 # nginx-proxy handles HTTPS
    delay: 10
    timeout: 120

- name: Create admin user
  become: true
  ansible.builtin.command:
    cmd: >
      docker compose exec -T admin flask mailu admin
      {{ mailu_admin_user }} {{ mailu_domain }} {{ mailu_admin_password }}
  args:
    chdir: "{{ mailu_install_path }}"
  register: mailu_admin_result
  changed_when: "'created' in mailu_admin_result.stdout"
  failed_when: false # May fail if user exists
  no_log: true # Hide admin password

- name: Create mail users
  become: true
  ansible.builtin.command:
    cmd: >
      docker compose exec -T admin flask mailu user
      {{ item.user }} {{ mailu_domain }} {{ item.password }}
  args:
    chdir: "{{ mailu_install_path }}"
  loop: "{{ mailu_users }}"
  register: mailu_user_result
  changed_when: false # Can't reliably detect from looped command
  failed_when: false # May fail if user exists
  no_log: true # Hide passwords

# These DKIM tasks loop over domain NAMES, not the mailu_additional_domains
# entries themselves. The entries nest user passwords, and Ansible echoes the
# loop item for every skipped or registered result - which printed live
# mailbox credentials in plaintext. Looping over names keeps secrets out of
# the output without needing no_log, which would also hide the DKIM keys these
# tasks exist to surface.
- name: Check if additional domain DKIM key exists
  become: true
  ansible.builtin.stat:
    path: "{{ mailu_install_path }}/dkim/{{ item }}.dkim.key"
  loop: "{{ mailu_additional_domains | default([]) | map(attribute='domain') | list }}"
  register: mailu_additional_dkim_stat

- name: Import additional domains with DKIM key generation (first time only)
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo 'domain:
        - name: {{ item.item }}
          dkim_key: -generate-
      ' | docker compose exec -T admin flask mailu config-import --update
  args:
    chdir: "{{ mailu_install_path }}"
    executable: /bin/bash
  loop: "{{ mailu_additional_dkim_stat.results | default([]) }}"
  when: not item.stat.exists
  register: mailu_domain_result_new
  changed_when: "'updated' in mailu_domain_result_new.stdout | default('')"
  failed_when: false

- name: Import additional domains without regenerating DKIM key
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo 'domain:
        - name: {{ item.item }}
      ' | docker compose exec -T admin flask mailu config-import --update
  args:
    chdir: "{{ mailu_install_path }}"
    executable: /bin/bash
  loop: "{{ mailu_additional_dkim_stat.results | default([]) }}"
  when: item.stat.exists
  register: mailu_domain_result_existing
  changed_when: "'updated' in mailu_domain_result_existing.stdout | default('')"
  failed_when: false

- name: Create additional domain users
  become: true
  ansible.builtin.command:
    cmd: >
      docker compose exec -T admin flask mailu user
      {{ item.1.user }} {{ item.0.domain }} {{ item.1.password }}
  args:
    chdir: "{{ mailu_install_path }}"
  loop: "{{ mailu_additional_domains | default([]) | subelements('users') }}"
  register: mailu_user_result
  changed_when: false
  failed_when: false # May fail if user exists
  no_log: true # Hide passwords

# `<domain>.dkim.key` is the PRIVATE key. These tasks used to cat it and print
# the result labelled "add this to DNS", which both leaked the signing key to
# stdout/CI logs and was useless as a DNS value. Derive the public half
# instead - that is what belongs in the TXT record.
- name: Get DKIM public key
  become: true
  ansible.builtin.shell:
    cmd: >
      set -o pipefail &&
      openssl rsa -in "{{ mailu_install_path }}/dkim/{{ mailu_domain }}.dkim.key"
      -pubout -outform DER 2>/dev/null | base64 -w0
  args:
    executable: /bin/bash
  register: mailu_dkim_key
  changed_when: false
  failed_when: false

- name: Display DKIM key for DNS
  ansible.builtin.debug:
    msg: |
      Add this DKIM record to DNS:
      Name: dkim._domainkey.{{ mailu_domain }}
      Type: TXT
      Value: v=DKIM1; k=rsa; p={{ mailu_dkim_key.stdout }}
  when: mailu_dkim_key.stdout is defined and mailu_dkim_key.stdout | length > 0

- name: Get DKIM public keys for additional domains
  become: true
  ansible.builtin.shell:
    cmd: >
      set -o pipefail &&
      openssl rsa -in "{{ mailu_install_path }}/dkim/{{ item }}.dkim.key"
      -pubout -outform DER 2>/dev/null | base64 -w0
  args:
    executable: /bin/bash
  loop: "{{ mailu_additional_domains | default([]) | map(attribute='domain') | list }}"
  register: mailu_additional_dkim_keys
  changed_when: false
  failed_when: false

- name: Display DKIM keys for additional domains
  ansible.builtin.debug:
    msg: |
      Add this DKIM record to DNS:
      Name: dkim._domainkey.{{ item.item }}
      Type: TXT
      Value: v=DKIM1; k=rsa; p={{ item.stdout }}
  loop: "{{ mailu_additional_dkim_keys.results | default([]) }}"
  when: item.stdout is defined and item.stdout | length > 0
