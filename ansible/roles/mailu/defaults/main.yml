---
# Mailu role defaults
# RETIRED 2026-11-05: Stalwart replaced Mailu on www (stalwart role README "Cutover and
# rollback runbook"). The role and /opt/mailu are kept for rollback and deleted in a later PR.
# Configured to run behind nginx-proxy (consolidated on www droplet)

# Domain configuration
mailu_domain: jasonernst.com
mailu_hostname: mail.jasonernst.com

# Installation path
mailu_install_path: /opt/mailu

# Secrets. Every mailu_op_* below is a fact set by the first task of the role
# from the matching 1Password item (Infrastructure vault), one `op` call each.
# They are NOT looked up here: a role default holding a lookup is re-run at
# every reference, and mailu_additional_domains alone is referenced by three
# loops and two templates (#542).
mailu_secret_key: "{{ mailu_op_secret_key }}"

# Admin account
mailu_admin_user: admin
mailu_admin_password: "{{ mailu_op_admin_password }}"

# Initial user accounts (created on first run)
mailu_users:
  - user: jason
    password: "{{ mailu_op_jasonernst_com_jason_password }}"
  - user: kai
    password: "{{ mailu_op_jasonernst_com_kai_password }}"
  # Service account used by www/staging.jasonernst.com (goblog) to send
  # one-time login codes (goblogplatform/goblog#523). Same shape as the
  # sair.run / rustd.xyz noreply accounts below. The password must match
  # what goblog is given: jasonernst_com_smtp_password in
  # ansible/jasonernst_com.yml reads the same 1Password item.
  - user: noreply
    password: "{{ mailu_op_goblog_smtp_password }}"

# Additional domains hosted on this Mailu instance
mailu_additional_domains:
  - domain: sair.run
    users:
      - user: jason
        password: "{{ mailu_op_sair_run_jason_password }}"
      # Service account the sair.run app authenticates as to send magic-link
      # emails. Credentials must stay in sync with the app's SMTP config.
      - user: noreply
        password: "{{ mailu_op_sair_smtp_password }}"
  # Adding a domain here also adds mail.<domain> to the front container's
  # VIRTUAL_HOST and LETSENCRYPT_HOST, which resolve to a single SAN cert
  # covering every mail hostname. Do not add a domain until mail.<domain>
  # resolves to this host: its ACME challenge would fail and take the whole
  # certificate issuance - including the already-working hostnames - with it.
  - domain: rustd.xyz
    users:
      - user: jason
        password: "{{ mailu_op_rustd_xyz_jason_password }}"
      # Service account for rustd.xyz passwordless login. The app hardcodes
      # quarkus.mailer.from=noreply@rustd.xyz and has no password fallback,
      # so this account is what makes the panel loginable at all.
      - user: noreply
        password: "{{ mailu_op_rustd_smtp_password }}"
  # darksearch.xyz: one mailbox; abuse@, dmca@ and postmaster@ are aliases into it
  # (below). The domain and its DKIM key were created first, out of band, with the
  # same config-import as the tasks, so terraform/mail-darksearch.tf carries the
  # real key (see the ordering note above).
  - domain: darksearch.xyz
    users:
      - user: jason
        password: "{{ mailu_op_darksearch_xyz_jason_password }}"

# Mail aliases (local@domain -> destination). Created idempotently at deploy;
# Mailu's CLI errors on existing aliases, tolerated the same way user creation is.
mailu_aliases:
  - local: contact
    domain: rustd.xyz
    destination: jason@rustd.xyz
  # RFC 5321 requires every mail domain to accept postmaster@; none did (550 User unknown).
  - local: postmaster
    domain: jasonernst.com
    destination: jason@jasonernst.com
  - local: postmaster
    domain: sair.run
    destination: jason@sair.run
  - local: postmaster
    domain: rustd.xyz
    destination: jason@rustd.xyz
  - local: postmaster
    domain: darksearch.xyz
    destination: jason@darksearch.xyz
  # Published on darksearch.xyz for abuse reports/takedowns and DMCA notices
  # (the DMCA designated agent registration uses dmca@).
  - local: abuse
    domain: darksearch.xyz
    destination: jason@darksearch.xyz
  - local: dmca
    domain: darksearch.xyz
    destination: jason@darksearch.xyz

# Features
# none until Mailu ships a webmail image on PHP >= 8.3.36: the pinned 2024.06 image runs
# PHP 8.3.15, open to PHP2Shell (CVE-2026-109618/109619, unauthenticated RCE). Bump the
# webmail digest below, then set this back to roundcube.
mailu_webmail: none # roundcube, snappymail, or none
mailu_antivirus: false # ClamAV uses lots of RAM
mailu_webdav: false
mailu_fetchmail: false

# Rate limiting
mailu_message_ratelimit: "200/day"
mailu_message_ratelimit_exemption: ""

# =============================================================================
# Docker network configuration (internal to Docker - no external mapping)
# =============================================================================
# These are INTERNAL Docker network addresses. They don't need to match your
# server's actual IP or any external network. Docker creates an isolated virtual
# network for Mailu containers to communicate with each other.
#
# You only need to change these if they conflict with an existing Docker network
# on this host (unlikely with these defaults).

# Private subnet for Mailu's internal container network
mailu_subnet: 192.168.203.0/24

# Static IP for Mailu's Unbound DNS resolver container (must be within mailu_subnet)
# All other Mailu containers use this as their DNS server for internal resolution
# (e.g., resolving container hostnames like "front", "admin", "smtp")
mailu_resolver_ip: 192.168.203.254

# nginx-proxy network subnet - used for REAL_IP_FROM to trust X-Forwarded-For headers
# Should match the subnet of your nginx-proxy Docker network
mailu_nginx_proxy_subnet: "172.18.0.0/16"

# Mail ports (bound to host - no conflict with nginx-proxy)
# HTTP/HTTPS are NOT bound - nginx-proxy handles those
# 587/143 (STARTTLS) are deliberately absent: Mailu 2024.06 leaves them out of
# its default PORTS list, so the front container never listens on them. Every
# client uses 465/993 (implicit TLS). To re-enable, add PORTS=...,587,143 to
# mailu.env.j2 and restore the port maps + DO firewall rules (see #557).
mailu_smtp_port: 25
mailu_smtps_port: 465
mailu_imaps_port: 993

# =============================================================================
# Image versions - pinned to specific digests for supply chain security
# Renovate bumps each digest to the current build of its tag (grouped into one PR,
# not automerged). The tag only says which branch the digest tracks; docker pulls by
# digest. Changing branch (e.g. 2024.06 -> a newer Mailu) means editing the tags here.
# =============================================================================
mailu_images:
  nginx:
    image: ghcr.io/mailu/nginx:2024.06
    digest: "sha256:0aca92c6a276c592beace4a6f3e7914d1cfac450fd54982a041641b95bfa71a5"
  admin:
    image: ghcr.io/mailu/admin:2024.06
    digest: "sha256:03424138d1d073811da923025d5bc768e35396f06cdcb3eeeeaf75e01dcf717b"
  dovecot:
    image: ghcr.io/mailu/dovecot:2024.06
    digest: "sha256:af5c80d8292f072b8f52e3cbf21a6ec25e259286fc7588de2e8d0f914fadd39f"
  postfix:
    image: ghcr.io/mailu/postfix:2024.06
    digest: "sha256:7c886b005323bf918401a57c18ec94b00d681af2ffcdc26239fb32fa34705264"
  unbound:
    image: ghcr.io/mailu/unbound:2024.06
    digest: "sha256:dc49e909e80755fbc9f6303adc7ba518bda53c3e23bed2a0a1d1d3c1f78cbe2c"
  rspamd:
    image: ghcr.io/mailu/rspamd:2024.06
    digest: "sha256:ab6ec21815f0871022d047ba7679e5c743656358b16033e678069ab4999e5719"
  clamav:
    image: ghcr.io/mailu/clamav:2.0 # versioned separately from the rest of Mailu
    digest: "sha256:3a255e78332e263d4fbccc87cc1df32a6903013ee5e4170f93aa4d43326db087"
  webmail:
    image: ghcr.io/mailu/webmail:2024.06
    digest: "sha256:b725c9c226df675ce4fc63490cc55a9a300fce4c5e76357771c87157e3307bb4"
  oletools:
    image: ghcr.io/mailu/oletools:2024.06
    digest: "sha256:f26403c16b8c0018f84b41a85b1ddb18fb79118fd1fc20816dd68b263ae13c8b"
  radicale:
    image: ghcr.io/mailu/radicale:2024.06
    digest: "sha256:2568dc08acfdc66333dbd05277dcb52a3b4d5a0915d95e9ad7c245a5f6852159"
  fetchmail:
    image: ghcr.io/mailu/fetchmail:2024.06
    digest: "sha256:29efe1374e0a875cfe1787622900aaa98fcc1e7458c68e31ce33b53ec0468b95"

# --- Nightly mailu -> nas backup (issue #479) ------------------------------
#
# Same pipeline shape as the goblog and rustd.xyz backups: push to the nas'
# BUILT-IN RSYNC DAEMON (port 873) over the tailnet - not ssh. See
# roles/backup_nas/README.md. The nas-side coordinates
# (mailu_backup_nas_path/_keep) live in group_vars/all.yml because the
# backup_nas role's prune cron (nas.yml, a separate playbook run) also
# reads them.
mailu_backup_local_dir: "{{ mailu_install_path }}/backups"
mailu_backup_local_keep: 7
mailu_backup_nas_host: nas # must match backup_nas_tailnet_hostname
mailu_backup_nas_rsync_user: svcbackup
mailu_backup_nas_rsync_port: 873
mailu_backup_nas_rsync_module: storage
# Full remote path is <module>/<subpath> = /volume1/storage/backups/mailu
# (matches mailu_backup_nas_path in group_vars/all.yml).
mailu_backup_nas_rsync_subpath: backups/mailu
mailu_backup_rsync_password_file: "{{ mailu_install_path }}/.rsync-nas-pass"
# Filled from jasonernst_com.yml via a 1Password lookup (`nas-rsync` item -
# the dedicated `svcbackup` UGOS account's password, rw on `storage` only; see
# roles/backup_nas/README.md). no_log'd wherever consumed.
mailu_backup_nas_rsync_password: ""
