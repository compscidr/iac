---
- name: Create Home Assistant Directories
  tags: homeassistant
  become: true
  ansible.builtin.file:
    mode: "755"
    path: "/etc/homeassistant"
    state: directory

# HACS lives in /config/custom_components/hacs as an unzipped release. The
# version marker is what makes this idempotent: writing a new version is the
# change that triggers the download + unpack + restart handlers.
- name: Create HACS directory
  tags: homeassistant
  become: true
  ansible.builtin.file:
    path: /etc/homeassistant/custom_components/hacs
    state: directory
    mode: "755"
    owner: "999"
    group: "10"

- name: Record the HACS version to install
  tags: homeassistant
  become: true
  ansible.builtin.copy:
    content: "{{ home_assistant_hacs_version }}\n"
    dest: /etc/homeassistant/custom_components/hacs/.ansible-hacs-version
    mode: "644"
    owner: "999"
    group: "10"
  notify: Install HACS

- name: Deploy Home Assistant
  tags: homeassistant
  community.docker.docker_container:
    name: homeassistant
    image: lscr.io/linuxserver/homeassistant:latest
    network_mode: host
    pull: true
    env:
      PUID: "999"
      PGID: "10"
      TZ: "America/Los_Angeles"
    restart_policy: unless-stopped
    volumes:
      - "/etc/homeassistant:/config"
      - "/run/dbus:/run:dbus:ro"
    ports:
      - "8123:8123"
    memory: 5g
    devices:
      - "/dev/bus/usb:/dev/bus/usb:rwm"
      # SONOFF ZBDongle-E (EFR32MG24) Zigbee coordinator for ZHA. Addressed by-id so
      # the host's ttyUSB numbering can shift without breaking the mapping.
      - "/dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_26ae5d834775f011aef2ad2f1045c30f-if00-port0:/dev/ttyUSB0:rwm"
    # The tty node is root:dialout on the host; HA runs as PUID 999 and needs the group.
    groups:
      - dialout
    capabilities:
      - net_admin
      - net_raw
