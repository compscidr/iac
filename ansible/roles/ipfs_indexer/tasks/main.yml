---
- name: Check that the data filesystem is mounted
  tags: ipfs-indexer
  ansible.builtin.command: findmnt --mountpoint {{ ipfs_indexer_data_mount }}
  register: ipfs_indexer_data_mounted
  changed_when: false
  failed_when: false

- name: Refuse to deploy without the data filesystem
  tags: ipfs-indexer
  ansible.builtin.assert:
    that: ipfs_indexer_data_mounted.rc == 0
    fail_msg: >-
      {{ ipfs_indexer_data_mount }} is not a mount point, so the index would land on the root
      filesystem. Bring the array up (cat /proc/mdstat) and mount it first.
    quiet: true

# Only for docker/kubo-init.sh (mounted into Kubo below), at the same tag as the image
- name: Clone ipfs_indexer
  tags: ipfs-indexer
  become: true
  ansible.builtin.git:
    repo: "{{ ipfs_indexer_repo }}"
    dest: "{{ ipfs_indexer_src }}"
    version: "{{ ipfs_indexer_version }}"

- name: Create ipfs_indexer data directory
  tags: ipfs-indexer
  become: true
  ansible.builtin.file:
    path: "{{ ipfs_indexer_data_dir }}"
    state: directory
    mode: "755"

# Container logs die with the container on every deploy, so the indexer also appends its output
# here (see the entrypoint below), next to the index on /data
- name: Create ipfs_indexer log directory
  tags: ipfs-indexer
  become: true
  ansible.builtin.file:
    path: "{{ ipfs_indexer_data_dir }}/logs"
    state: directory
    mode: "755"

# copytruncate: the tee in the container keeps the file open (appending, so it carries on at
# the start of the truncated file)
- name: Rotate ipfs_indexer logs
  tags: ipfs-indexer
  become: true
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ipfs-indexer
    content: |
      {{ ipfs_indexer_data_dir }}/logs/*.log {
          daily
          rotate {{ ipfs_indexer_log_days }}
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    mode: "644"

# Takedowns: add a line (cid, cid/path or /ipfs/cid/path) to local.deny; the indexer re-reads
# it every 5 min and drops matches from the index. force: false never overwrites your entries.
- name: Create ipfs_indexer config directory
  tags: ipfs-indexer
  become: true
  ansible.builtin.file:
    path: "{{ ipfs_indexer_config_dir }}"
    state: directory
    mode: "755"

- name: Create local denylist
  tags: ipfs-indexer
  become: true
  ansible.builtin.copy:
    dest: "{{ ipfs_indexer_config_dir }}/local.deny"
    content: |
      # one entry per line: cid, cid/path or /ipfs/cid/path (see ipfs_indexer README)
    force: false
    mode: "644"

# Our own Kubo node, so crawling isn't held to a public gateway's rate limit. The indexer
# reaches its gateway over a private network (8080 isn't published); the RPC API/WebUI on 5001
# is published to LAN + tailnet with no auth (see Deploy Kubo). darksearch result links still
# use the public gateway. kubo-init.sh (from the indexer repo) stops it announcing or serving what
# it crawls, and caps its cache at 2GB.
- name: Create ipfs_indexer network
  tags: ipfs-indexer
  become: true
  community.docker.docker_network:
    name: ipfs-indexer

- name: Create Kubo denylists directory
  tags: ipfs-indexer
  become: true
  ansible.builtin.file:
    path: "{{ ipfs_indexer_config_dir }}/denylists"
    state: directory
    mode: "755"

# Kubo refuses to serve badbits content; the indexer also checks badbits itself, so this is
# a second layer. Refreshed on every run; Kubo picks it up when the container restarts.
- name: Download badbits for Kubo
  tags: ipfs-indexer
  become: true
  ansible.builtin.get_url:
    url: https://badbits.dwebops.pub/badbits.deny
    dest: "{{ ipfs_indexer_config_dir }}/denylists/badbits.deny"
    force: true
    mode: "644"

# The WebUI (http://<host>:5001/webui) calls the RPC API, which rejects origins it doesn't
# list (only localhost by default), so allow the LAN names. Runs after indexer.sh on every start.
- name: Allow the Kubo WebUI from the LAN
  tags: ipfs-indexer
  become: true
  ansible.builtin.copy:
    dest: "{{ ipfs_indexer_config_dir }}/kubo-webui.sh"
    content: |
      #!/bin/sh
      set -e
      ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '{{ ipfs_indexer_kubo_webui_origins | to_json }}'
      ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '["PUT", "POST"]'
    mode: "755"

- name: Deploy Kubo
  tags: ipfs-indexer
  become: true
  community.docker.docker_container:
    name: ipfs
    image: "ipfs/kubo:{{ ipfs_indexer_kubo_version }}"
    state: "{{ ipfs_indexer_state }}"
    # --enable-gc: drop cached blocks once Datastore.StorageMax is reached
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker", "--enable-gc"]
    networks:
      - name: ipfs-indexer
    # RPC API + WebUI, LAN and tailnet like the indexer's port (no router forward). It's admin
    # access to the node with no auth, so don't forward it.
    published_ports:
      - "{{ ipfs_indexer_kubo_webui_port }}:5001"
    volumes:
      - "{{ ipfs_indexer_src }}/docker/kubo-init.sh:/container-init.d/indexer.sh:ro"
      - "{{ ipfs_indexer_config_dir }}/kubo-webui.sh:/container-init.d/webui.sh:ro"
      - "{{ ipfs_indexer_config_dir }}/denylists:/etc/ipfs/denylists:ro"
      - ipfs-indexer-kubo:/data/ipfs
    env:
      IPFS_PROFILE: server
    restart_policy: unless-stopped

# Pulls the release image if it isn't on the host yet (built by the indexer's release
# workflow, not here), and recreates the container when the pinned tag changes
- name: Deploy ipfs_indexer
  tags: ipfs-indexer
  become: true
  no_log: true # ADMIN_TOKEN
  community.docker.docker_container:
    name: ipfs-indexer
    image: "{{ ipfs_indexer_image }}:{{ ipfs_indexer_version }}"
    state: "{{ ipfs_indexer_state }}"
    # output to docker logs as before, and appended to a file on /data that outlives the
    # container. exec keeps the indexer as PID 1 (docker stop signals it directly); tee runs as
    # its child through bash's process substitution
    entrypoint:
      - /bin/bash
      - -c
      - exec /usr/local/bin/ipfs_indexer ipfs:8080 > >(tee -a /var/lib/ipfs_indexer/logs/indexer.log) 2>&1
    networks:
      - name: ipfs-indexer
    published_ports:
      - "{{ ipfs_indexer_port }}:9090"
    # the directory, not the file: editors that replace the file would detach a file mount.
    # read-write: the admin endpoints edit local.deny (temp file + rename, hence the directory)
    volumes:
      - "{{ ipfs_indexer_config_dir }}:/etc/ipfs_indexer"
      - "{{ ipfs_indexer_data_dir }}:/var/lib/ipfs_indexer"
    env:
      RUST_LOG: info
      LOCAL_DENYLIST: /etc/ipfs_indexer/local.deny
      DATA_DIR: /var/lib/ipfs_indexer
      # darksearch admin area's takedown endpoints (see ipfs_indexer README, ADMIN_TOKEN)
      ADMIN_TOKEN: "{{ lookup('community.general.onepassword', 'DarkSearch Indexer Admin Token', field='password', vault='Infrastructure',
                     account_id=onepassword_account_id) }}"
    restart_policy: unless-stopped
