---
# ipfs_indexer (https://github.com/compscidr/ipfs_indexer), the search backend
# for darksearch.xyz. Runs the image its release workflow publishes on ghcr and
# crawls through its own Kubo node (no public gateway rate limit); it loads the badbits
# denylist at startup. darksearch result links still use a public gateway.
# darksearch reaches it over Tailscale at http://ubuntu-cube.tail21090.ts.net:9090.
# The port is published on all interfaces: LAN + tailnet, no router forward.

ipfs_indexer_repo: https://github.com/compscidr/ipfs_indexer.git
# A release tag (vX.Y.Z): the image to run, and the checkout kubo-init.sh comes from.
# Publish one by pushing the tag in the indexer repo (see its README).
ipfs_indexer_version: "v0.4.1"
ipfs_indexer_image: ghcr.io/compscidr/ipfs_indexer
ipfs_indexer_src: /opt/ipfs_indexer
ipfs_indexer_port: 9090
# holds local.deny, the takedown list
ipfs_indexer_config_dir: /etc/ipfs_indexer
# The persisted index (ipfs_indexer#106) and its logs, on the NVMe root volume. It used to
# be on the /data HDD RAID, which random writes to index.sqlite pinned at 100% (#830).
# Mounted into the container as DATA_DIR.
ipfs_indexer_data_dir: /var/lib/ipfs_indexer
# pages fetched at once (CRAWL_WORKERS, ipfs_indexer#246). Fetches through the local Kubo
# take ~2 s, so each worker adds roughly 30 pages a minute; Kubo's limits weren't close at 30.
ipfs_indexer_crawl_workers: 30
# started | stopped. Search on darksearch is separately gated by INDEXER_ONLINE
# in its src/search.php.
ipfs_indexer_state: started
# days of logs kept in {{ ipfs_indexer_data_dir }}/logs (rotated daily)
ipfs_indexer_log_days: 30
# the node the indexer crawls through (matches ipfs_indexer's docker/docker-compose.yml)
ipfs_indexer_kubo_version: v0.43.1
# Kubo's WebUI at http://ubuntu-cube.local:5001/webui; open it by one of these origins
ipfs_indexer_kubo_webui_port: 5001
ipfs_indexer_kubo_webui_origins:
  - "http://{{ inventory_hostname }}:{{ ipfs_indexer_kubo_webui_port }}"
  - "http://{{ ansible_default_ipv4.address }}:{{ ipfs_indexer_kubo_webui_port }}"
  - "http://localhost:{{ ipfs_indexer_kubo_webui_port }}"
  - "http://127.0.0.1:{{ ipfs_indexer_kubo_webui_port }}"
