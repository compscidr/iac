---
# backup_nas role defaults
#
# Receiving end of the nightly backup pipelines (rustd.xyz pg_dump, goblog,
# mailu): tailnet membership + the nas-side prune crons + freshness check.
# That's all this role does - the actual receive path is the nas' built-in rsync daemon (UGOS UI, port 873,
# a MANUAL prerequisite; see README.md), which ansible doesn't configure.
#
# The shared coordinates with the pushing end (rustd_xyz role,
# projects.yml) - host/path/keep-count - live in group_vars/all.yml
# (rustd_xyz_backup_nas_*), not here, since both roles run in separate
# playbooks with no common vars_file. See the comment there for why.
#
# backup_nas_tailnet_hostname below is the same kind of cross-role
# sync contract: it MUST match rustd_xyz_backup_nas_host
# (group_vars/all.yml), the name the droplet-side push script dials. It
# lives here rather than in group_vars/all.yml because, unlike the
# host/path/keep vars above, only this role ever sets it (the value is an
# argument to `tailscale up`, not something rustd_xyz reads) - the
# agreement is enforced by convention/comment, not a shared variable.

# Tailnet hostname this role gives the nas via `tailscale up --hostname`.
# Must match rustd_xyz_backup_nas_host in group_vars/all.yml - that's the
# name the droplet-side backup script (rustd_xyz role) dials over the
# tailnet. Set explicitly rather than left to default to the appliance's
# own hostname (DXP8800PLUS-3F06), which must never become the tailnet name.
backup_nas_tailnet_hostname: nas

# The rsync daemon's module root and the UGOS account it runs as (the
# `auth users` of the `storage` module - same name the three push-side
# `*_backup_nas_rsync_user` defaults dial).
#
# UGOS does not use POSIX permissions on its shares. It has its own
# NFSv4-style ACL ("ugacl", an xattr, managed by `ugacltool`), and where a
# directory carries one the mode bits are ignored - `backups/` is 777 and
# still refuses svcbackup, because its ugacl names only jason and admin.
# Share-level access is an inheritable ugacl entry on the share ROOT; the
# UGOS UI writes one when a user is granted rw on the share. A by-hand
# chmod/chown on the root (2026-09-20, to make it readable as jason)
# stripped that entry and dropped the root to "Linux mode", so every push
# since authenticated and then failed with EACCES for two nights before
# the freshness check fired. The role re-asserts the entry every run.
# Never chmod/chown/setfacl the share root by hand; the POSIX layer is not
# what the daemon is checked against.
backup_nas_rsync_module_root: /volume1/storage
backup_nas_rsync_user: svcbackup
# Every principal the root must admit, not just svcbackup. Writing a ugacl
# with ONLY the daemon user (2026-09-22) locked everyone else out: the ACL
# replaces the mode bits, so the 750 jason:admin root stopped admitting
# uid 999 / gid 10 (jason:admin) - the PUID/PGID every media container
# (plex, sonarr, sabnzbd, ...) runs as - and Plex went down 2 seconds
# after the play. `owner::` and `group:admin` are the two entries UGOS
# itself puts on every share (compare `ugacltool get /volume1/docker`);
# same shape throughout: allow, full rw, inherit to files and dirs.
backup_nas_rsync_ugacl_entries:
  - "owner::allow:rwxpdDaARWc--:-fd-"
  - "group:admin:allow:rwxpdDaARWc--:-fd-"
  - "user:{{ backup_nas_rsync_user }}:allow:rwxpdDaARWc--:-fd-"

# --- Backup freshness alerting (issue #479) --------------------------------
#
# Daily dead-man's switch: alert to discord #dev-alerts when a pipeline's
# newest db snapshot on the nas is older than the threshold. One check per
# pipeline; the dirs/globs come from the shared coordinates in
# group_vars/all.yml. The db snapshot is each push script's LAST transfer,
# so a fresh one means that night's whole run succeeded.
backup_nas_freshness_checks:
  - { name: rustd-db, dir: "{{ rustd_xyz_backup_nas_path }}", glob: "rustd-*.dump" }
  - { name: goblog, dir: "{{ jasonernst_com_backup_nas_path }}/db", glob: "goblog-*.db" }
  - { name: mailu, dir: "{{ mailu_backup_nas_path }}/db", glob: "mailu-*.db" }
  # Not a push from a droplet like the three above - a local snapshot taken on
  # this host by the minecraft_game role (issue #565). It rides this check
  # anyway: the failure being watched for is "backups stopped appearing", which
  # is the same question regardless of where they came from, and one
  # dead-man's switch beats four.
  - { name: minecraft, dir: "{{ minecraft_backup_nas_path }}", glob: "minecraft-*.tar.gz" }
  - { name: minecraft-bedrock, dir: "{{ minecraft_bedrock_backup_nas_path }}", glob: "minecraft-bedrock-*.tar.gz" }
  - { name: factorio, dir: "{{ factorio_backup_nas_path }}", glob: "factorio-*.tar.gz" }
# Pushes run nightly ~04:00-05:00, the check at 08:00: a normal night shows
# ~3-4h, a single missed night ~28h. 26 catches one missed night on the
# first morning after.
backup_nas_freshness_max_age_hours: 26
# Discord channel webhook URL (a plain URL - no bot). 0600 root file;
# filled from nas.yml via a 1Password lookup (`discord-dev-alerts` item,
# Infrastructure vault, `credential` field). no_log'd wherever consumed.
backup_nas_webhook_file: /root/.backup-alert-webhook
backup_nas_discord_webhook: ""
