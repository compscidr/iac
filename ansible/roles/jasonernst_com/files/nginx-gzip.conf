# Compress responses for every vhost behind nginx-proxy. The base image ships nginx.conf with
# `#gzip on;` commented out and nginx-proxy's generated default.conf only sets `gzip_types`
# (http-level, so it applies here too - do NOT repeat it, and text/html is always included).
# Until 2026-09-22 every page and stylesheet went out uncompressed. Same file as the projects
# role's: the two droplets run the same proxy and diverge only if someone edits one copy.
# gzip_proxied any: nginx-proxy is the proxy, so every response it serves is a proxied one
# and the default (off) would compress nothing.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
