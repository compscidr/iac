---
# SAIR orchestrator role defaults

# sair-orchestrator release to run (a vX.Y.Z git tag; docker.yml pushes the
# image as X.Y.Z). Pinned so a new release shows up as a Renovate PR here;
# merging it does not deploy anything, re-run projects.yml to upgrade.
sair_orchestrator_version: "v0.1.9"
sair_orchestrator_image: "ghcr.io/compscidr/sair-orchestrator:{{ sair_orchestrator_version | regex_replace('^v', '') }}"
sair_orchestrator_port: 9090
sair_orchestrator_dashboard_port: 8081
sair_orchestrator_domain: "orchestrator.sair.run"
# Agent API host (/api/v1/ runs, leases, devices): the default SAIR_API_URL of
# sair-mcp. Served by the same container and cert as the dashboard. Its DNS
# record (terraform/projects.tf) must exist before the play, for Let's Encrypt.
# Empty turns the agent API off.
sair_orchestrator_api_domain: "api.sair.run"
sair_orchestrator_letsencrypt_email: "ernstjason1@gmail.com"

# DeviceSource address (reachable from the orchestrator container)
# Default assumes Tailscale MagicDNS resolution to ubuntu-cube
sair_orchestrator_device_source_addr: "ubuntu-cube:8080"

# Portal database path (for API key validation)
sair_orchestrator_portal_db_dir: "/opt/sair-portal/data"

# URL of the Prometheus the admin dashboard charts read from (sair-orchestrator#713),
# reached by container name on nginx-proxy. Empty disables the charts.
sair_orchestrator_prometheus_url: "http://prometheus:9090"

# Secrets (override in playbook via 1Password lookups)
sair_orchestrator_api_key: ""
sair_orchestrator_tenant_config: ""
sair_orchestrator_device_source_config: ""
sair_orchestrator_ghcr_token: ""
sair_orchestrator_ghcr_user: "compscidr"
