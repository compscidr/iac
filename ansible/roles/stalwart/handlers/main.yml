---
# stalwart-cli in stalwart's network namespace, as the admin, against the 8081 listener on
# 127.0.0.1: the only address the admin's credential accepts (README "Admin
# restriction"). Retried in the shell while a just-(re)created container starts. Its
# output is discarded, never shown or stored: stalwart-cli may echo plan values, and no
# scrub can be trusted to catch every form. On failure the second handler prints the
# command to run by hand. The checksum stamp is written only on success; tasks/main.yml
# re-notifies while it does not match.
- name: Apply Stalwart plan
  become: true
  ansible.builtin.shell:
    cmd: >-
      for i in $(seq 10); do
      {{ stalwart_cli_docker }} apply --file /plan.ndjson >/dev/null 2>&1
      && sha256sum plan.ndjson > plan.applied.sha256 && exit 0; sleep 3; done; exit 1
    chdir: "{{ stalwart_install_path }}/etc"
  register: stalwart_apply
  changed_when: true
  failed_when: false
  no_log: true

- name: Report a failed Stalwart apply
  listen: Apply Stalwart plan
  ansible.builtin.fail:
    msg: >-
      stalwart-cli apply of {{ stalwart_install_path }}/etc/plan.ndjson failed (rc={{ stalwart_apply.rc }}).
      Its output is not shown because it can echo secrets; see it with
      `sudo {{ stalwart_cli_docker }} apply --file /plan.ndjson`.
      If the admin no longer authenticates while {{ stalwart_install_path }}/bootstrap.done exists,
      delete bootstrap.done: the next run redoes the bootstrap, which re-seeds the admin.
  when: stalwart_apply.rc != 0
