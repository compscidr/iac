---
# stalwart-cli in stalwart's network namespace, as the admin, against the 8081 listener on
# 127.0.0.1: the only address the admin's credential accepts (README "Admin
# restriction"). Retried in the shell while a just-(re)created container starts. Its
# output is discarded, never shown or stored: stalwart-cli may echo plan values, and no
# scrub can be trusted to catch every form. On failure the second handler prints the
# command to run by hand. The checksum stamp is written only on success; tasks/main.yml
# re-notifies while it does not match.
- name: Apply Stalwart plan
  become: true
  ansible.builtin.shell:
    cmd: >-
      for i in $(seq 10); do
      {{ stalwart_cli_docker }} apply --file /plan.ndjson >/dev/null 2>&1
      && sha256sum plan.ndjson > plan.applied.sha256 && exit 0; sleep 3; done; exit 1
    chdir: "{{ stalwart_install_path }}/etc"
  register: stalwart_apply
  changed_when: true
  failed_when: false
  no_log: true

- name: Report a failed Stalwart apply
  listen: Apply Stalwart plan
  ansible.builtin.fail:
    msg: >-
      stalwart-cli apply of {{ stalwart_install_path }}/etc/plan.ndjson failed (rc={{ stalwart_apply.rc }}).
      Its output is not shown because it can echo secrets; see it with
      `sudo {{ stalwart_cli_docker }} apply --file /plan.ndjson`.
      If the admin no longer authenticates while {{ stalwart_install_path }}/bootstrap.done exists,
      delete bootstrap.done: the next run redoes the bootstrap, which re-seeds the admin.
  when: stalwart_apply.rc != 0

# After the plan (handlers run in file order), so the Application already names the new URL.
# The command holds no secret; its output is discarded like the apply's.
- name: Update Stalwart apps
  become: true
  ansible.builtin.shell:
    cmd: >-
      for i in $(seq 10); do
      {{ stalwart_cli_docker }} create Action/UpdateApps >/dev/null 2>&1
      && printf '%s\n' '{{ stalwart_bulwark_url }}' > bulwark.applied && exit 0; sleep 3; done; exit 1
    chdir: "{{ stalwart_install_path }}/etc"
  register: stalwart_update_apps
  changed_when: true
  failed_when: false

- name: Report a failed app update
  listen: Update Stalwart apps
  ansible.builtin.fail:
    msg: >-
      Action/UpdateApps failed (rc={{ stalwart_update_apps.rc }}); it is retried on the next run.
      See the error with `sudo {{ stalwart_cli_docker }} create Action/UpdateApps`.
  when: stalwart_update_apps.rc != 0

# Copied from the jasonernst_com role (which owns nginx-proxy) rather than depending on it.
# Reloads without dropping the TLS listeners; `nginx -t` first, so a broken vhost.d file
# fails the play. Skipped only when the proxy is not running.
- name: Look up the nginx-proxy container
  listen: Reload nginx-proxy
  become: true
  community.docker.docker_container_info:
    name: nginx-proxy
  register: stalwart_nginx_proxy

- name: Test and reload nginx-proxy's config
  listen: Reload nginx-proxy
  become: true
  community.docker.docker_container_exec:
    container: nginx-proxy
    argv:
      - sh
      - -c
      - nginx -t && nginx -s reload
  register: stalwart_nginx_reload
  failed_when: stalwart_nginx_reload.rc != 0
  changed_when: true
  when: stalwart_nginx_proxy.exists and stalwart_nginx_proxy.container.State.Running
