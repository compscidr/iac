---
# Ollama role defaults

# Container settings
ollama_container_name: "ollama"
ollama_image: "ollama/ollama:latest"
ollama_restart_policy: "unless-stopped"

# Port configuration
ollama_port: 11434
ollama_bind_address: "0.0.0.0" # Bind to all interfaces (use firewall/Tailscale for access control)

# GPU support
ollama_gpu_enabled: true # Set to false for CPU-only deployment

# CPU/RAM offloading for large models
# Set ollama_num_gpu to control GPU layer count (0 = CPU only, -1 = auto)
# With 128GB RAM + 16GB VRAM, can run 70B+ models with partial GPU acceleration
ollama_num_gpu: -1 # -1 = auto (Ollama decides), 0 = CPU only, N = specific layer count

# Data persistence
ollama_data_path: "/var/lib/ollama"

# Models to pull on deployment (empty list = none)
# Current set reflects what runs on ubuntu-beast, which is now an
# RTX 5080 (16.3GB) plus an RTX 3080 (10GB) = 26.5GB of VRAM.
# The MoE variants (*-A3B-*) are the sweet spot: large total params for
# quality, 3B active params for responsiveness.
ollama_models:
  - "qwen2.5:72b" # large, GPU + RAM offload
  - "qwen2.5:14b" # fast fallback, fits in VRAM
  - "qwen3-coder:30b" # coding, partial offload
  - "hf.co/bartowski/cerebras_Qwen3-Coder-REAP-25B-A3B-GGUF:Q4_K_M" # MoE coder, fits in VRAM
  - "hf.co/bartowski/Qwen_Qwen3.5-35B-A3B-GGUF:IQ3_XXS" # MoE general, fits in VRAM
  # Second hermes-capable model, kept alongside the Qwen one so both can
  # be selected from the hermes dashboard without a redeploy. Dense 12B,
  # so raw tok/s is lower, but it emits far fewer tokens per agent turn
  # and measured faster end-to-end (0.3s vs 0.7s median on tool turns).
  - "gemma4:12b" # 256K-capable, see the -256k variant below

# Custom Modelfile variants created locally via `ollama create`.
# Each entry generates a new tag from `base` with the supplied PARAMETER
# overrides. Used to produce extended-context variants of base models.
ollama_modelfiles:
  - name: "qwen2.5:14b-16k"
    base: "qwen2.5:14b"
    parameters:
      num_ctx: 16384
  - name: "qwen2.5:14b-32k"
    base: "qwen2.5:14b"
    parameters:
      num_ctx: 32768
  # Long-context variant for Hermes Agent (hermes requires >=64K ctx
  # from local models). MoE base: 3B active params keeps it responsive.
  #
  # Was 64K, sized for a single 16.3GB card that the 16.7GB of weights
  # did not even fit -- ~22% of the model ran on the CPU. With the 3080
  # added there is room for both the whole model and a much larger
  # window, so this doubles to 128K.
  #
  # Measured on the two-card box (IQ3_XXS weights + q8_0 KV, flash
  # attention on), loading each variant and reading size_vram back:
  #
  #    ctx    KV cache   resident   on GPU
  #    64K      680 MiB    17.3 GB    100%
  #   128K     1360 MiB    18.1 GB    100%   <- here
  #   256K     2720 MiB    20.1 GB     95%   <- spills one layer
  #
  # Context is unusually cheap on this model because the MoE carries KV
  # on only 10 of its 42 layers; weights dominate the footprint.
  #
  # 256K is NOT capacity-limited -- llama.cpp's fit heuristic pushed a
  # single layer to the CPU while the 3080 still had 4.4GB free. If a
  # larger window is wanted later, try OLLAMA_SCHED_SPREAD=1 before
  # concluding it does not fit.
  #
  # ponytail: 128K chosen because it is the largest window measured at
  # 100% GPU with no tuning. Revisit with SCHED_SPREAD for 256K.
  #
  # hermes_ollama_context_window in roles/hermes MUST match this number.
  # Those two disagreeing is what caused the stuck sessions fixed in
  # ae9f514c -- hermes worked from a window 4x larger than it had.
  # Gemma 4 at its full native window. Measured at 13.5GB resident and
  # 100% on GPU -- its 256K footprint is essentially the same as its
  # 128K one (13.5 vs 13.6GB), because sliding-window attention caps the
  # KV cache instead of growing it with context. That is what makes a
  # window the 35B cannot reach affordable here.
  #
  # WARNING: this model must be run with reasoning DISABLED. With
  # reasoning on it does not terminate -- 19,906 characters of thinking
  # against an 8000-token budget, still finish=length, no answer -- and
  # "low"/"medium"/"high" are all identical to leaving it unset. Only
  # an explicit "none" works. See hermes_ollama_catalog in roles/hermes.
  - name: "gemma4:12b-256k"
    base: "gemma4:12b"
    parameters:
      num_ctx: 262144
  - name: "qwen3.5:35b-a3b-128k"
    base: "hf.co/bartowski/Qwen_Qwen3.5-35B-A3B-GGUF:IQ3_XXS"
    parameters:
      num_ctx: 131072

# Tailscale access control (when behind Tailscale)
ollama_tailscale_only: true # If true, only allow Tailscale IPs

# Attention/KV-cache tuning. A long-context model spends real VRAM on
# its KV cache, and ollama silently spills layers to the CPU when the
# total doesn't fit — on the single 5080, hermes's model landed at 17GB
# against 16GB of card and ran 22% on CPU. Flash attention plus a q8_0
# KV cache roughly halves that cache. Still worth keeping with two
# cards: it is what makes the 128K window above cost only 1360 MiB.
# Set ollama_flash_attention to false to go back to f16 KV.
ollama_flash_attention: true
ollama_kv_cache_type: "q8_0"
