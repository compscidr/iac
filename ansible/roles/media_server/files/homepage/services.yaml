---
# One tile per service. Public hostnames where one exists, otherwise the
# LAN port on nas.local (same exposure story as the services themselves).
# Widgets talk to the apps by container name on the media network; the
# {{HOMEPAGE_VAR_*}} keys are env vars the role reads out of each app's own
# config file at deploy time (see tasks/main.yml), so nothing lives here.
- Watch:
    - Plex:
        href: http://nas.local:32400/web
        description: Movies, TV, music, live TV
        icon: plex.png
        widget:
          type: plex
          url: http://plex:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
          fields: ["streams", "movies", "tv"]
    - Ombi:
        href: https://ombi.jasonernst.com
        description: Request movies and shows
        icon: ombi.png
        widget:
          type: ombi
          url: http://ombi:3579
          key: "{{HOMEPAGE_VAR_OMBI_KEY}}"
    - Threadfin:
        href: http://nas.local:34400/web/
        description: IPTV -> Plex Live TV tuner
        icon: threadfin.png

- Manage:
    - Sonarr:
        href: https://sonarr.jasonernst.com
        description: TV
        icon: sonarr.png
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - Radarr:
        href: https://radarr.jasonernst.com
        description: Movies
        icon: radarr.png
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Lidarr:
        href: http://nas.local:8686
        description: Music
        icon: lidarr.png
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
    - Prowlarr:
        href: http://nas.local:9696
        description: Indexers
        icon: prowlarr.png
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - Cleanuparr:
        href: http://nas.local:11011
        description: Stalled / malware download cleanup
        icon: cleanuparr.png

- Download:
    - Transmission:
        href: http://nas.local:9091
        description: Torrents (via NordVPN)
        icon: transmission.png
        widget:
          type: transmission
          url: http://transmission:9091
    - SABnzbd:
        href: http://nas.local:8080
        description: Usenet
        icon: sabnzbd.png
        widget:
          type: sabnzbd
          url: http://sabnzbd:8080
          key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
    - slskd:
        href: http://nas.local:5030
        description: Soulseek
        icon: slskd.png
        widget:
          type: slskd
          url: http://slskd:5030
          key: "{{HOMEPAGE_VAR_SLSKD_KEY}}"
    - Bitmagnet:
        href: http://nas.local:3333
        description: Self-hosted DHT indexer
        icon: bitmagnet.png
        # No native widget; one GraphQL count via the custom API widget.
        # torrentContent is classified content, which lags the raw crawl.
        widget:
          type: customapi
          url: http://bitmagnet:3333/graphql
          method: POST
          headers:
            Content-Type: application/json
          requestBody: >-
            {"query": "{ torrentContent { search(input: {limit: 0, totalCount: true, facets: {contentType: {aggregate: true}}})
            { totalCount aggregations { contentType { value count } } } } }"}
          # ponytail: the facet list is sorted by type name (audiobook, comic,
          # ebook, movie, music, software, tv_show, xxx, null), so movie=3 and
          # tv_show=6 by index; if a type ever drops to zero the indexes shift.
          mappings:
            - field: data.torrentContent.search.totalCount
              label: Indexed
              format: number
            - field: data.torrentContent.search.aggregations.contentType.3.count
              label: Movies
              format: number
            - field: data.torrentContent.search.aggregations.contentType.6.count
              label: TV
              format: number

- Encode:
    - Unmanic SDR:
        href: http://ubuntu-beast.local:8888
        description: Re-encode oversized SDR files (GPU)
        icon: unmanic.png
        widget:
          type: unmanic
          url: http://192.168.0.10:8888
    - Unmanic HDR:
        href: http://ubuntu-beast.local:8889
        description: Tone-map HDR to SDR (GPU)
        icon: unmanic.png
        widget:
          type: unmanic
          url: http://192.168.0.10:8889

- Infra:
    - NAS:
        href: https://nas.jasonernst.com
        description: UGOS
        icon: mdi-nas
    - Home Assistant:
        href: http://nas.local:8123
        description: Home automation
        icon: home-assistant.png
        # Four values is the widget's limit, so each is an HA template that
        # folds a room's temperature and humidity (Mysa thermostats) into one,
        # and the AirCube's CO2 + light into the fourth. The is_number guards
        # keep an offline thermostat from erroring the whole tile.
        widget:
          type: homeassistant
          url: http://192.168.0.15:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - template: >-
                {%- set t = states('sensor.mysa_969708_current_temperature') -%}
                {%- set h = states('sensor.mysa_969708_current_humidity') -%}
                {{ (t | float | round(1)) if is_number(t) else '–' }}°
                {{ (h | float | round) if is_number(h) else '–' }}%
              label: bedroom
            - template: >-
                {%- set t = states('sensor.mysa_d1a6f8_current_temperature') -%}
                {%- set h = states('sensor.mysa_d1a6f8_current_humidity') -%}
                {{ (t | float | round(1)) if is_number(t) else '–' }}°
                {{ (h | float | round) if is_number(h) else '–' }}%
              label: dining
            - template: >-
                {%- set t = states('sensor.mysa_d1a788_current_temperature') -%}
                {%- set h = states('sensor.mysa_d1a788_current_humidity') -%}
                {{ (t | float | round(1)) if is_number(t) else '–' }}°
                {{ (h | float | round) if is_number(h) else '–' }}%
              label: living
            - template: "{{ states('sensor.stuckatprototype_aircube_carbon_dioxide') }} ppm · {{ states('sensor.stuckatprototype_aircube_illuminance') }} lx"
              label: co2 / light
    - Uptime Kuma:
        href: https://uptime.jasonernst.com
        description: Service monitoring
        icon: uptime-kuma.png
        # Needs a status page in Uptime Kuma with slug "media" listing the
        # monitors; the widget reads that page, there is no full API.
        widget:
          type: uptimekuma
          url: https://uptime.jasonernst.com
          slug: media
    - Router:
        href: http://192.168.0.1
        description: TP-Link Archer GE800
        icon: router.png
        # Client counts and WAN throughput come from Home Assistant's TP-Link
        # Router integration (HACS). HA runs with host networking rather than
        # on the media docker network, so it has no container name to resolve
        # and is reached at the NAS's LAN IP. The token is the 1Password
        # "homeassistant" item.
        widget:
          type: homeassistant
          url: http://192.168.0.15:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - state: sensor.tp_link_router_total_wired_clients
              label: wired
              value: "{state}"
            - state: sensor.tp_link_router_total_main_wifi_clients
              label: wifi
              value: "{state}"
            - state: sensor.archer_ge800_download_speed
              label: down
            - state: sensor.archer_ge800_upload_speed
              label: up
