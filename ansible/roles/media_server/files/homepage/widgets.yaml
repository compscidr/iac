---
# Shipping this file replaces Homepage's default widgets (search box etc.).
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
- resources:
    label: NAS
    cpu: true
    memory: true
    uptime: true
# The array, bound read-only into the container for this one number.
- resources:
    label: Storage
    disk: /mnt/storage
