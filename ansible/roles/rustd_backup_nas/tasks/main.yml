---
# Receiving end of the rustd.xyz nightly pg_dump backup pipeline: tailnet
# membership + prune cron. That's the whole role now.
#
# The actual receive path is the nas' built-in rsync daemon (UGOS's own
# service, port 873) - a MANUAL prerequisite enabled once in the UGOS UI
# (module `storage` -> /volume1/storage, `auth users = jason:rw`). This
# role does not and cannot configure that daemon; there is no ansible
# module for UGOS's UI and no config file on disk this role is allowed to
# template (closed vendor appliance). See README.md for the full field
# story (the earlier ssh-forced-command design this role used to implement
# is gone - killed by a vendor-patched rsync, a global sshd ForceCommand,
# and admin-account passthrough, none of which the daemon path is subject
# to). rustd_xyz (projects.yml) owns the push side.

# Tailscale membership: the backup pipeline design assumed the nas was
# already a tailnet member (see the ACL analysis in
# docs/superpowers/specs/2026-08-11-rustd-xyz-prod-deploy-design.md), but
# this appliance never joined - the tailscale package is present (matches
# the `creates` guard below) but the daemon was never enabled and `up` was
# never run. This role owns the join because the nas is a vendor-managed
# UGREEN appliance that never gets common_cli (see README's "Tailnet
# membership" section) - so it can't rely on that role's tailscale tasks
# the way workstations and servers do.
- name: Install Tailscale
  become: true
  tags: [tailscale]
  ansible.builtin.shell: |  # noqa: command-instead-of-module
    set -o pipefail
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale
    executable: /bin/bash

# common_cli's install.sh normally starts and enables tailscaled itself;
# this appliance's install.sh run (whenever the package first landed) never
# went through that, so the daemon has to be brought up explicitly here.
- name: Enable and start the Tailscale daemon
  become: true
  tags: [tailscale]
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

# Idempotency guard: unlike common_cli (which re-runs `tailscale up` on
# every play with failed_when: false), prefer not re-invoking `up` on every
# run against a vendor appliance - only do it when the backend isn't
# Running. BackendState (machine-readable JSON) rather than grepping the
# human text: it distinguishes NeedsLogin AND the logged-in-but-stopped
# state, where plain `tailscale status` exits 0 with no "Logged out." line.
- name: Check current Tailscale backend state
  become: true
  tags: [tailscale]
  ansible.builtin.command:
    cmd: tailscale status --json
  register: rustd_backup_nas_tailscale_status
  changed_when: false
  failed_when: false

- name: Connect to Tailscale
  become: true
  tags: [tailscale]
  ansible.builtin.command:
    # --hostname: the appliance's own hostname (DXP8800PLUS-3F06) must not
    # become the tailnet name the droplet-side config
    # (rustd_xyz_backup_nas_host) dials.
    # --accept-dns=false: MagicDNS must not rewrite a vendor appliance's
    # resolv.conf.
    # No --ssh: the vendor sshd stays authoritative for admin login. Backups
    # no longer go over sshd at all (see the header comment) - the droplet
    # dials the nas' rsync daemon (port 873) directly over this tailnet
    # join, which needs no Tailscale SSH involvement either way.
    cmd: >-
      tailscale up --authkey={{ rustd_backup_nas_tailscale_authkey }}
      --hostname={{ rustd_backup_nas_tailnet_hostname }} --accept-dns=false
  vars:
    rustd_backup_nas_tailscale_authkey: "{{ lookup('community.general.onepassword', 'Tailscale', field='credential', vault=onepassword_vault,
      account_id=onepassword_account_id) }}"
  register: rustd_backup_nas_tailscale_up
  changed_when: true
  # No failed_when: false here (unlike common_cli): this role's whole design
  # rides on the join, so an expired/invalid authkey must fail the play, not
  # be silently skipped. no_log because the command line carries the authkey.
  no_log: true
  when: >-
    rustd_backup_nas_tailscale_status.rc != 0 or
    ((rustd_backup_nas_tailscale_status.stdout or '{}') | from_json).BackendState | default('')
    != 'Running'

# No user, target-directory, or key task here. The nas' built-in rsync
# daemon (UGOS UI, port 873) is what actually receives the backups - it
# manages its own module root (/volume1/storage), its own directory
# creation under it (rsync --mkpath on the push side), and its own
# username/password auth entirely separate from Linux accounts and sshd.
# There is nothing left for ansible to create or authorize on the receive
# side; see README.md for why every earlier attempt at an ssh-based
# receiver (dedicated user, target-dir ownership, rrsync, then a
# forced-command receive script) was abandoned.

- name: Prune rustd.xyz backups older than the retention window
  become: true
  ansible.builtin.cron:
    name: "prune rustd.xyz db backups"
    minute: "30"
    hour: "5"
    # Root cron, not a per-user one: the rsync daemon writes as whatever
    # Linux user the daemon process itself runs as (vendor-configured,
    # opaque to this role) - there's no single non-root account this role
    # can reliably own a crontab for anymore (the old
    # rustd_xyz_backup_nas_user var this used to key off of is gone along
    # with the ssh receiver it named), and root can always read/delete
    # regardless of which user owns the dumped files.
    job: >-
      find {{ rustd_xyz_backup_nas_path }} -maxdepth 1 -type f -name 'rustd-*.dump'
      -mtime +{{ rustd_xyz_backup_nas_keep }} -delete

# Same-shaped prune for the jasonernst.com goblog pipeline (push side:
# jasonernst_com role, jasonernst_com.yml). Only the db/ snapshots are
# pruned - the sibling uploads/ directory is an additive mirror of the live
# images/files and must never be aged out.
# ponytail: the third pipeline (mailu) landed and the role kept its rustd
# name anyway - the rename touches runbook tags (`--tags rustd-backup`) and
# a dozen prose references for zero function. Rename only if the tag/docs
# churn ever becomes worth it.
- name: Prune jasonernst.com backups older than the retention window
  become: true
  ansible.builtin.cron:
    name: "prune jasonernst.com goblog db backups"
    minute: "35"
    hour: "5"
    # Directory-exists guard: the db/ dir only appears once the first push
    # from the www droplet lands, and find on a missing path errors - which
    # cron turns into nightly mail/log noise. Silent no-op until then.
    job: >-
      [ -d {{ jasonernst_com_backup_nas_path }}/db ] &&
      find {{ jasonernst_com_backup_nas_path }}/db -maxdepth 1 -type f -name 'goblog-*.db'
      -mtime +{{ jasonernst_com_backup_nas_keep }} -delete

# Same-shaped prune for the mailu pipeline (push side: mailu role,
# jasonernst_com.yml). Only the db/ snapshots are pruned - dkim/, data/,
# mail/, and mailu.env are additive mirrors that must never be aged out.
# Directory-exists guard for the same first-push reason as above.
- name: Prune mailu backups older than the retention window
  become: true
  ansible.builtin.cron:
    name: "prune mailu db backups"
    minute: "40"
    hour: "5"
    job: >-
      [ -d {{ mailu_backup_nas_path }}/db ] &&
      find {{ mailu_backup_nas_path }}/db -maxdepth 1 -type f -name 'mailu-*.db'
      -mtime +{{ mailu_backup_nas_keep }} -delete

# --- Backup freshness alerting (issue #479) --------------------------------
#
# See backup-freshness-check.py.j2's header for the design: a nas-side
# dead-man's switch beats per-unit OnFailure hooks on the droplets because
# it also catches the timer/host/tailnet dying - the silent-stop modes that
# motivated #479 in the first place.
- name: Write the discord webhook file
  become: true
  ansible.builtin.copy:
    dest: "{{ rustd_backup_nas_webhook_file }}"
    content: "{{ rustd_backup_nas_discord_webhook }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy the backup freshness check script
  become: true
  ansible.builtin.template:
    src: backup-freshness-check.py.j2
    dest: /usr/local/bin/backup-freshness-check.py
    owner: root
    group: root
    mode: "0700"

# 08:00, after every pipeline's nightly push window (~04:00-05:00) and this
# role's own prune crons (05:30-05:40).
- name: Check backup freshness daily and alert to discord
  become: true
  ansible.builtin.cron:
    name: "backup freshness check -> discord"
    minute: "0"
    hour: "8"
    job: /usr/local/bin/backup-freshness-check.py
